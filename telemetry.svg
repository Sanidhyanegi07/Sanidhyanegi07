<svg xmlns="http://www.w3.org/2000/svg" width="22" height="20" viewBox="0 0 22 20">
  <!-- Matching flat-square background -->
  <rect width="22" height="20" rx="3" fill="#020306"/>
  
  <!-- Outer expanding sonar ping -->
  <circle cx="11" cy="10" r="3.5" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0">
    <animate attributeName="r" values="3.5;8" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Mid ring pulse -->
  <circle cx="11" cy="10" r="3.5" fill="none" stroke="#89c3ff" stroke-width="1.2" opacity="0">
    <animate attributeName="r" values="3.5;6" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Glowing central core -->
  <circle cx="11" cy="10" r="3.2" fill="#58a6ff">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
