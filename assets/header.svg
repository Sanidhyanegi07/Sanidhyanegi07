<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sanidhya Negi — software engineer in training, Java and C++">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .title  { font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif; font-weight: 600; }
      .mono   { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B3A5C" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" fill="#0E1A2B"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <rect x="20" y="20" width="960" height="220" fill="none" stroke="#3A5A7D" stroke-width="1"/>

  <g stroke="#E8A33D" stroke-width="1.5">
    <path d="M12,20 H28 M20,12 V28"/>
    <path d="M972,20 H988 M980,12 V28"/>
    <path d="M12,240 H28 M20,232 V248"/>
    <path d="M972,240 H988 M980,232 V248"/>
  </g>

  <text x="52" y="112" class="title" font-size="46" fill="#EAF1F8">Sanidhya Negi</text>
  <text x="54" y="142" class="mono" font-size="15" fill="#8CA3BE">Software engineer in training — Java, C++, and the structure in between.</text>

  <line x1="52" y1="164" x2="948" y2="164" stroke="#2A4B6D" stroke-width="1"/>

  <g class="mono" font-size="13" fill="#A9BCD1">
    <text x="52" y="200">Role: B.Tech CSE student</text>
    <line x1="330" y1="188" x2="330" y2="204" stroke="#2A4B6D" stroke-width="1"/>
    <text x="352" y="200">Primary: Java</text>
    <line x1="470" y1="188" x2="470" y2="204" stroke="#2A4B6D" stroke-width="1"/>
    <text x="492" y="200">Secondary: C++</text>
  </g>

  <text x="940" y="228" text-anchor="end" class="mono" font-size="11" fill="#4A6684">Sheet 01</text>
</svg>
