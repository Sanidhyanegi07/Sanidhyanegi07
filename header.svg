<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 48px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -2px;
      }
      .role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 14px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .meta {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #6e7681;
        letter-spacing: 2px;
      }
      .accent-text {
        fill: #58a6ff;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 2px;
      }
      .dot { fill: #58a6ff; }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
    </style>

    <!-- Strict Card Boundary: NOTHING goes outside rounded border -->
    <clipPath id="card-bounds">
      <rect x="0" y="0" width="1000" height="280" rx="12"/>
    </clipPath>

    <!-- Deep Space Gradient from Beginning -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Precision Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(88,166,255,0.03)" stroke-width="0.5"/>
      <circle cx="40" cy="40" r="0.8" fill="rgba(88,166,255,0.07)"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="core-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══════════════ STRICTLY CLIPPED CANVAS ═══════════════ -->
  <g clip-path="url(#card-bounds)">
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>

    <!-- Subtle Astrometric Starfield -->
    <circle cx="85" cy="80" r="0.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="140" cy="220" r="0.5" fill="#58a6ff" opacity="0.35"/>
    <circle cx="260" cy="55" r="0.6" fill="#ffffff" opacity="0.35"/>
    <circle cx="340" cy="180" r="0.5" fill="#58a6ff" opacity="0.25"/>
    <circle cx="440" cy="35" r="0.75" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="240" r="0.5" fill="#58a6ff" opacity="0.3"/>
    <circle cx="640" cy="230" r="0.7" fill="#ffffff">
      <animate attributeName="opacity" values="0.25;0.85;0.25" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="45" r="0.75" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="945" cy="235" r="0.55" fill="#58a6ff" opacity="0.35"/>

    <!-- Ambient glowing horizontal scanline (Strictly clipped) -->
    <rect width="100%" height="1.5" fill="rgba(88,166,255,0.06)">
      <animate attributeName="y" values="-10;290;-10" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- ═══════════════ LEFT: SLEEK PERSONAL IDENTITY ═══════════════ -->

    <!-- Top-left Status Indicator -->
    <g transform="translate(50, 44)">
      <rect x="0" y="0" width="2" height="12" fill="#58a6ff" opacity="0.9"/>
      <circle cx="12" cy="6" r="2.5" class="dot" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="9.5" class="accent-text">SYS.STATUS // ONLINE</text>
    </g>

    <!-- Name & Role -->
    <text x="50" y="128" class="name">Sanidhya Negi</text>
    
    <text x="52" y="162" class="role">
      &gt; Systems Engineer<tspan class="cursor" fill="#58a6ff">_</tspan>
    </text>

    <!-- Precision Divider Line (Ends cleanly at x=280) -->
    <line x1="50" y1="192" x2="190" y2="192" stroke="rgba(88, 166, 255, 0.4)" stroke-width="1"/>
    <line x1="190" y1="192" x2="310" y2="192" stroke="rgba(88, 166, 255, 0.1)" stroke-width="0.75"/>

    <!-- Tags -->
    <text x="50" y="226" class="meta" xml:space="preserve">C++   <tspan fill="#58a6ff" opacity="0.8">//</tspan>   JAVA   <tspan fill="#58a6ff" opacity="0.8">//</tspan>   SYSTEM DESIGN   <tspan fill="#58a6ff" opacity="0.8">//</tspan>   DSA</text>

    <!-- ═══════════════ RIGHT: ENHANCED 3D ORBITAL CONSTRUCT (FROM THE BEGINNING) ═══════════════ -->
    <!-- Positioned cleanly at (780, 140) with 60px margin on all sides -->
    <g transform="translate(780, 140)">
      
      <!-- ── 7 SPACETIME GRAVITATIONAL LENSING LINES (60% Background / 40% Theme Blend) ── -->
      <!-- Curvature lines with sharp terminal dots, strictly proportional -->
      <!-- Line 1: Inner (Shortest) -->
      <g>
        <path d="M -26,14 Q 0,9 26,14" fill="none" stroke="#263a54" stroke-width="0.75" opacity="0.85"/>
        <circle cx="-26" cy="14" r="1.1" fill="#58a6ff" opacity="0.9"/>
        <circle cx="26" cy="14" r="1.1" fill="#58a6ff" opacity="0.9"/>
      </g>

      <!-- Line 2 -->
      <g>
        <path d="M -38,-17 Q 0,-11 38,-17" fill="none" stroke="#1f2f45" stroke-width="0.7" opacity="0.8"/>
        <circle cx="-38" cy="-17" r="1.0" fill="#ffffff" opacity="0.85"/>
        <circle cx="38" cy="-17" r="1.0" fill="#58a6ff" opacity="0.85"/>
      </g>

      <!-- Line 3 -->
      <g>
        <path d="M -50,22 Q 0,14 50,22" fill="none" stroke="#29405e" stroke-width="0.75" opacity="0.8"/>
        <circle cx="-50" cy="22" r="1.1" fill="#58a6ff" opacity="0.9"/>
        <circle cx="50" cy="22" r="1.1" fill="#ffffff" opacity="0.85"/>
      </g>

      <!-- Line 4 -->
      <g>
        <path d="M -62,-26 Q 0,-17 62,-26" fill="none" stroke="#1d2c40" stroke-width="0.65" opacity="0.75"/>
        <circle cx="-62" cy="-26" r="1.0" fill="#58a6ff" opacity="0.8"/>
        <circle cx="62" cy="-26" r="1.0" fill="#ffffff" opacity="0.8"/>
      </g>

      <!-- Line 5 -->
      <g>
        <path d="M -74,31 Q 0,20 74,31" fill="none" stroke="#253a54" stroke-width="0.65" opacity="0.75"/>
        <circle cx="-74" cy="31" r="1.1" fill="#ffffff" opacity="0.85"/>
        <circle cx="74" cy="31" r="1.1" fill="#58a6ff" opacity="0.85"/>
      </g>

      <!-- Line 6 -->
      <g>
        <path d="M -86,-36 Q 0,-24 86,-36" fill="none" stroke="#1a2738" stroke-width="0.6" opacity="0.7"/>
        <circle cx="-86" cy="-36" r="1.0" fill="#58a6ff" opacity="0.75"/>
        <circle cx="86" cy="-36" r="1.0" fill="#58a6ff" opacity="0.75"/>
      </g>

      <!-- Line 7: Outermost (Longest) -->
      <g>
        <path d="M -98,41 Q 0,26 98,41" fill="none" stroke="#22354c" stroke-width="0.6" opacity="0.65"/>
        <circle cx="-98" cy="41" r="1.1" fill="#58a6ff" opacity="0.85"/>
        <circle cx="98" cy="41" r="1.1" fill="#ffffff" opacity="0.85"/>
      </g>

      <!-- ── THE 4 ROTATING 3D ORBITAL RINGS (From Beloved Beginning Version) ── -->

      <!-- Ring 1: Outer dashed ring (40s spin) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="112" ry="34" stroke="rgba(88,166,255,0.2)" stroke-width="0.6" fill="none" stroke-dasharray="3 9"/>
        <circle cx="112" cy="0" r="1.8" fill="#58a6ff" filter="url(#glow)"/>
        <circle cx="-112" cy="0" r="1.2" fill="#ffffff" opacity="0.6"/>
      </g>

      <!-- Ring 2: Mid solid inclined ring (25s counter-spin) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="74" ry="22" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" fill="none"/>
        <circle cx="74" cy="0" r="2" fill="#ffffff" opacity="0.85"/>
        <circle cx="-74" cy="0" r="1.8" fill="#58a6ff" opacity="0.75" filter="url(#glow)"/>
      </g>

      <!-- Ring 3: Inner active 3D inclined ring (15s spin, 25° tilt) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="42" ry="42" stroke="rgba(88,166,255,0.35)" stroke-width="0.6" fill="none" stroke-dasharray="4 4" transform="rotate(25)"/>
        <circle cx="42" cy="0" r="2.2" fill="#58a6ff" transform="rotate(25)" filter="url(#glow)"/>
        <circle cx="-42" cy="0" r="1.4" fill="#ffffff" transform="rotate(25)" opacity="0.8"/>
      </g>

      <!-- Ring 4: Rapid core orbit (10s counter-spin, -30° tilt) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="22" ry="14" stroke="rgba(88,166,255,0.4)" stroke-width="0.5" fill="none" transform="rotate(-30)"/>
        <circle cx="22" cy="0" r="1.4" fill="#ffffff" transform="rotate(-30)"/>
      </g>

      <!-- Center Singularity Core (From Beginning, Enhanced) -->
      <circle cx="0" cy="0" r="7" fill="#58a6ff" filter="url(#core-glow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="6.5;8;6.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.95"/>
    </g>

  </g> <!-- End of clipped container -->

  <!-- ═══════════════ CRISP CARD PERIMETER BORDER ═══════════════ -->
  <!-- 1px hairline container border with rounded corners: ZERO overflow -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="12" fill="none" stroke="rgba(88, 166, 255, 0.2)" stroke-width="1"/>
</svg>