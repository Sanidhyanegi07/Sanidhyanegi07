<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 48px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -2px;
      }
      .role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 14px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .meta {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: 2px;
      }
      .accent-text {
        fill: #58a6ff;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 2px;
      }
      .dot { fill: #58a6ff; }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
    </style>

    <!-- Strict Card Perimeter: NOTHING goes outside rounded boundary -->
    <clipPath id="card-bounds">
      <rect x="0" y="0" width="1000" height="280" rx="12"/>
    </clipPath>

    <!-- Deep Space Obsidian Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020307"/>
      <stop offset="50%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>

    <!-- Glowing Sun Corona Gradient -->
    <radialGradient id="sun-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#79c0ff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#388bfd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Core Filter -->
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════ STRICTLY CLIPPED CANVAS CONTAINER ═══════════════ -->
  <g clip-path="url(#card-bounds)">
    <!-- Base Deep Space Background (Zero Background Circles) -->
    <rect width="100%" height="100%" fill="url(#bg)"/>

    <!-- Astrometric Stars -->
    <g>
      <circle cx="85" cy="80" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="140" cy="220" r="0.6" fill="#58a6ff" opacity="0.6"/>
      <circle cx="260" cy="55" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="340" cy="180" r="0.5" fill="#58a6ff" opacity="0.5"/>
      <circle cx="440" cy="35" r="0.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="240" r="0.6" fill="#58a6ff" opacity="0.5"/>
      <circle cx="640" cy="230" r="0.75" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="920" cy="45" r="0.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="955" cy="235" r="0.6" fill="#58a6ff" opacity="0.5"/>
    </g>

    <!-- ═══════════════ LEFT: SLEEK PERSONAL DEVELOPER IDENTITY ═══════════════ -->
    <!-- Confined strictly to x=50..x=380: ZERO overlap, ZERO clutter -->

    <!-- Top-left Status Indicator -->
    <g transform="translate(50, 44)">
      <rect x="0" y="0" width="2" height="12" fill="#58a6ff"/>
      <circle cx="12" cy="6" r="2.5" class="dot" filter="url(#neon-glow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="9.5" class="accent-text">SYS.STATUS // ONLINE</text>
    </g>

    <!-- Name & Role -->
    <text x="50" y="128" class="name">Sanidhya Negi</text>
    
    <text x="52" y="162" class="role">
      &gt; Systems Engineer<tspan class="cursor" fill="#58a6ff">_</tspan>
    </text>

    <!-- Precision Divider Line (Solid, ends cleanly at x=280) -->
    <line x1="50" y1="192" x2="190" y2="192" stroke="#58a6ff" stroke-width="1.2"/>
    <line x1="190" y1="192" x2="310" y2="192" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>

    <!-- Tags -->
    <text x="50" y="226" class="meta" xml:space="preserve">C++   <tspan fill="#58a6ff">//</tspan>   JAVA   <tspan fill="#58a6ff">//</tspan>   SYSTEM DESIGN   <tspan fill="#58a6ff">//</tspan>   DSA</text>

    <!-- ═══════════════ RIGHT: 100% IN-MOTION 3D ORBITAL SYSTEM ═══════════════ -->
    <!-- ZERO STATIC ELEMENTS: Every ring, every axis, and every particle is in continuous motion -->
    <g transform="translate(770, 140)">

      <!-- ── LEVEL 1: OUTER SYSTEM (Diameter = 220px, 32s Clockwise Rotation) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
        <!-- Ring Track In Motion -->
        <ellipse cx="0" cy="0" rx="110" ry="38" fill="none" stroke="#58a6ff" stroke-width="1.4"/>
        <!-- Axis Line In Motion -->
        <line x1="-110" y1="0" x2="110" y2="0" stroke="#ffffff" stroke-width="1.5" filter="url(#neon-glow)"/>
        <!-- Terminal Particles In Motion -->
        <circle cx="110" cy="0" r="3.0" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="-110" cy="0" r="2.2" fill="#58a6ff"/>
        <!-- Axis Terminal Ticks -->
        <line x1="110" y1="-4" x2="110" y2="4" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="-110" y1="-4" x2="-110" y2="4" stroke="#58a6ff" stroke-width="1.5"/>
      </g>

      <!-- ── LEVEL 2: MID-OUTER SYSTEM (Diameter = 180px, 24s Counter-Clockwise Rotation) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
        <!-- Ring Track In Motion -->
        <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
        <!-- Axis Line In Motion -->
        <line x1="-90" y1="0" x2="90" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
        <!-- Terminal Particles In Motion -->
        <circle cx="-90" cy="0" r="2.8" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="90" cy="0" r="2.2" fill="#38bdf8"/>
        <!-- Axis Terminal Ticks -->
        <line x1="-90" y1="-3.5" x2="-90" y2="3.5" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="90" y1="-3.5" x2="90" y2="3.5" stroke="#38bdf8" stroke-width="1.5"/>
      </g>

      <!-- ── LEVEL 3: MID SYSTEM (Diameter = 144px, 17s Clockwise Rotation) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="17s" repeatCount="indefinite"/>
        <!-- Ring Track In Motion -->
        <ellipse cx="0" cy="0" rx="72" ry="24" fill="none" stroke="#79c0ff" stroke-width="1.5"/>
        <!-- Axis Line In Motion -->
        <line x1="-72" y1="0" x2="72" y2="0" stroke="#ffffff" stroke-width="1.5"/>
        <!-- Terminal Particles In Motion -->
        <circle cx="72" cy="0" r="2.8" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="-72" cy="0" r="2.2" fill="#79c0ff"/>
        <!-- Axis Terminal Ticks -->
        <line x1="72" y1="-3.5" x2="72" y2="3.5" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="-72" y1="-3.5" x2="-72" y2="3.5" stroke="#79c0ff" stroke-width="1.5"/>
      </g>

      <!-- ── LEVEL 4: INNER SYSTEM (Diameter = 108px, 11s Counter-Clockwise Rotation) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
        <!-- Ring Track In Motion -->
        <ellipse cx="0" cy="0" rx="54" ry="18" fill="none" stroke="#a5d6ff" stroke-width="1.6"/>
        <!-- Axis Line In Motion -->
        <line x1="-54" y1="0" x2="54" y2="0" stroke="#a5d6ff" stroke-width="1.6"/>
        <!-- Terminal Particles In Motion -->
        <circle cx="-54" cy="0" r="2.6" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="54" cy="0" r="2.0" fill="#58a6ff"/>
        <!-- Axis Terminal Ticks -->
        <line x1="-54" y1="-3" x2="-54" y2="3" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="54" y1="-3" x2="54" y2="3" stroke="#a5d6ff" stroke-width="1.5"/>
      </g>

      <!-- ── LEVEL 5: THROAT SYSTEM (Diameter = 72px, 7s Clockwise Rotation) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
        <!-- Ring Track In Motion -->
        <ellipse cx="0" cy="0" rx="36" ry="12" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <!-- Axis Line In Motion -->
        <line x1="-36" y1="0" x2="36" y2="0" stroke="#ffffff" stroke-width="1.8"/>
        <!-- Terminal Particles In Motion -->
        <circle cx="36" cy="0" r="2.5" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="-36" cy="0" r="2.0" fill="#58a6ff"/>
      </g>

      <!-- ── LEVEL 6: RAPID CORE AXIS (Diameter = 44px, 4s Counter-Clockwise Rotation) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
        <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffffff" stroke-width="2.0"/>
        <circle cx="22" cy="0" r="2.2" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="-22" cy="0" r="1.8" fill="#ffffff"/>
      </g>

      <!-- ═══════════════ THE CENTRAL GLOWING SUN / STAR ═══════════════ -->
      <g>
        <!-- Rotating 8-Point Solar Flare Rays In Continuous Motion (20s) -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
          <!-- 4-Point Primary Solar Rays -->
          <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15" fill="#ffffff" opacity="0.9" filter="url(#neon-glow)"/>
          <!-- 4-Point Secondary Solar Rays (45° offset) -->
          <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10" fill="#79c0ff" opacity="0.8" transform="rotate(45)" filter="url(#neon-glow)"/>
        </g>

        <!-- Pulsing Solar Corona -->
        <circle cx="0" cy="0" r="8.5" fill="url(#sun-core-glow)">
          <animate attributeName="r" values="7.5;10;7.5" dur="2.4s" repeatCount="indefinite"/>
        </circle>

        <!-- Incandescent White-Hot Stellar Core -->
        <circle cx="0" cy="0" r="4.5" fill="#ffffff" filter="url(#neon-glow)">
          <animate attributeName="r" values="4;5.2;4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="2.4" fill="#ffffff"/>
      </g>

    </g> <!-- End of Right Construct -->

  </g> <!-- End of clipped container -->

  <!-- ═══════════════ CRISP CARD PERIMETER BORDER ═══════════════ -->
  <!-- 1px hairline container border with rounded corners: ZERO overflow -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="12" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.35"/>
</svg>