<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
      .subtitle { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; font-weight: 400; fill: #a0a0a0; letter-spacing: 1px; }
      .accent { fill: #00ff66; }
      .line { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1px; fill: none; }
      .orbit { stroke: rgba(0, 255, 102, 0.4); stroke-width: 1px; fill: none; stroke-dasharray: 3 6; }
      .node { fill: #00ff66; }
      .text-muted { fill: #555555; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />

  <!-- Animated 3D Orbital Rings -->
  <g transform="translate(620, 125)">
    <!-- Ring 1 (Inner Spin) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="80" ry="20" class="orbit" transform="rotate(30)" />
      <circle cx="80" cy="0" r="3" class="node" transform="rotate(30)" />
    </g>

    <!-- Ring 2 (Outer Spin) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="120" ry="35" class="line" transform="rotate(-45)" />
      <circle cx="-120" cy="0" r="2" fill="#ffffff" transform="rotate(-45)" />
    </g>

    <!-- Ring 3 (Z-Axis Spin) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
      <ellipse cx="0" cy="0" rx="60" ry="60" class="line" stroke-dasharray="2 8" />
      <circle cx="60" cy="0" r="1.5" fill="#ffffff" opacity="0.6" />
      <circle cx="-60" cy="0" r="1.5" fill="#ffffff" opacity="0.6" />
    </g>
    
    <!-- Center Core -->
    <circle cx="0" cy="0" r="6" class="node">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="6;7;6" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Text -->
  <text x="60" y="115" class="title">Sanidhya Negi</text>
  <text x="60" y="145" class="subtitle">&gt; SYSTEMS ENGINEER <tspan class="accent">_</tspan></text>
  <text x="60" y="200" class="text-muted">C++ • JAVA • REACT • DSA • SYSTEM ARCHITECTURE</text>
  
  <!-- Decorative Grid / Tech UI -->
  <line x1="60" y1="40" x2="80" y2="40" class="line" />
  <line x1="60" y1="45" x2="70" y2="45" class="line" />
</svg>
