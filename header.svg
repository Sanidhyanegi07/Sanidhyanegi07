<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 52px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -1.5px;
      }
      .role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 15px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .meta {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 12px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: 2px;
      }
      .accent-text {
        fill: #58a6ff;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 2px;
        font-weight: 700;
      }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
      
      /* Guarantees 1px crisp lines even under 3D perspective scaling */
      .noscale { vector-effect: non-scaling-stroke; }
    </style>

    <clipPath id="card-bounds">
      <rect x="0" y="0" width="1000" height="280" rx="16"/>
    </clipPath>

    <!-- Deep Space Obsidian Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010204"/>
      <stop offset="50%" stop-color="#04060b"/>
      <stop offset="100%" stop-color="#010204"/>
    </linearGradient>

    <!-- Cosmic Gas Glow for the Airborne Swarm -->
    <radialGradient id="galaxy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="10%" stop-color="#89c3ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#1f6feb" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#010204" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ═══════════════ CANVAS CONTAINER ═══════════════ -->
  <g clip-path="url(#card-bounds)">
    <rect width="100%" height="100%" fill="url(#bg)"/>

    <!-- Deep Space Void -->

    <!-- ═══════════════ LEFT: PREMIUM HUD IDENTITY ═══════════════ -->
    <g transform="translate(50, 45)">
      <!-- Left side animated slider has been completely removed -->

      <!-- Content Block -->
      <g transform="translate(0, 0)">
        
        <!-- Status Indicator -->
        <g transform="translate(0, 10)">
          <!-- Pure SVG layered glow (GitHub Safe) -->
          <circle cx="4" cy="4" r="8" fill="#58a6ff" opacity="0.3">
            <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="4" cy="4" r="4" fill="#58a6ff"/>
          <text x="18" y="8" class="accent-text">SYS.STATUS // ONLINE_</text>
        </g>

        <!-- Identity -->
        <text x="0" y="85" class="name">Sanidhya Negi</text>
        <text x="2" y="125" class="role">
          &gt; Systems Engineer<tspan class="cursor" fill="#58a6ff">_</tspan>
        </text>

        <!-- Precision Divider -->
        <line x1="0" y1="155" x2="160" y2="155" stroke="#58a6ff" stroke-width="1.5"/>
        <line x1="160" y1="155" x2="300" y2="155" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>

        <!-- Tech Stack Tags -->
        <text x="0" y="185" class="meta" xml:space="preserve">C++   <tspan fill="#58a6ff">//</tspan>   JAVA   <tspan fill="#58a6ff">//</tspan>   SYSTEM DESIGN   <tspan fill="#58a6ff">//</tspan>   DSA</text>
      </g>
    </g>


    <!-- ═══════════════ RIGHT: GIANT TUMBLING GALAXY ═══════════════ -->
    <g transform="translate(770, 140)">
      
      <!-- Cosmic Gas Glow -->
      <circle cx="0" cy="0" r="135" fill="url(#galaxy-glow)" opacity="0.3"/>

      <!-- Global Tumble: The entire geometric galaxy slowly rotates on the Z axis -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="180s" repeatCount="indefinite"/>

        <!-- ── PLANE 0° ── -->
        <g transform="rotate(0) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="135" fill="none" stroke="#1f6feb" stroke-width="1.5" opacity="0.5" stroke-dasharray="1 12 2 25 1 8" class="noscale"/>
            <circle cx="0" cy="0" r="105" fill="none" stroke="#58a6ff" stroke-width="1.8" opacity="0.7" stroke-dasharray="2 15 3 10 1 5" class="noscale"/>
            <circle cx="105" cy="0" r="6" fill="#58a6ff" opacity="0.4" class="noscale"/>
            <circle cx="105" cy="0" r="3.5" fill="#58a6ff" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="70" fill="none" stroke="#89c3ff" stroke-width="2.5" opacity="0.8" stroke-dasharray="3 8 2 15 4 6" class="noscale"/>
            <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="3" opacity="1.0" stroke-dasharray="4 4 2 5 3 2" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 36° ── -->
        <g transform="rotate(36) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="130" fill="none" stroke="#1f6feb" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 18 1 15 3 10" class="noscale"/>
            <circle cx="0" cy="0" r="110" fill="none" stroke="#58a6ff" stroke-width="1.6" opacity="0.6" stroke-dasharray="1 10 2 20 1 5" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="75" fill="none" stroke="#89c3ff" stroke-width="2.2" opacity="0.9" stroke-dasharray="2 12 4 8 2 15" class="noscale"/>
            <circle cx="-75" cy="0" r="7" fill="#89c3ff" opacity="0.4" class="noscale"/>
            <circle cx="-75" cy="0" r="4" fill="#89c3ff" class="noscale"/>
            <circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="2.8" opacity="0.9" stroke-dasharray="3 5 2 3 4 4" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 72° ── -->
        <g transform="rotate(72) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="133" fill="none" stroke="#1f6feb" stroke-width="1.8" opacity="0.3" stroke-dasharray="1 25 2 10 1 15" class="noscale"/>
            <circle cx="0" cy="133" r="5" fill="#1f6feb" opacity="0.5" class="noscale"/>
            <circle cx="0" cy="133" r="3" fill="#1f6feb" class="noscale"/>
            <circle cx="0" cy="0" r="95" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.7" stroke-dasharray="3 12 1 18 2 8" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="65" fill="none" stroke="#89c3ff" stroke-width="2" opacity="0.8" stroke-dasharray="4 6 2 10 3 12" class="noscale"/>
            <circle cx="0" cy="0" r="40" fill="none" stroke="#ffffff" stroke-width="3.2" opacity="1.0" stroke-dasharray="5 3 2 6 3 2" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 108° ── -->
        <g transform="rotate(108) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="128" fill="none" stroke="#1f6feb" stroke-width="1.4" opacity="0.4" stroke-dasharray="2 20 1 15 2 10" class="noscale"/>
            <circle cx="0" cy="0" r="100" fill="none" stroke="#58a6ff" stroke-width="1.7" opacity="0.6" stroke-dasharray="2 10 2 20 1 12" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="72" fill="none" stroke="#89c3ff" stroke-width="2.4" opacity="0.8" stroke-dasharray="3 10 3 8 2 14" class="noscale"/>
            <circle cx="0" cy="0" r="32" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.9" stroke-dasharray="2 4 4 3 2 5" class="noscale"/>
            <circle cx="32" cy="0" r="6" fill="#ffffff" opacity="0.4" class="noscale"/>
            <circle cx="32" cy="0" r="3.5" fill="#ffffff" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 144° ── -->
        <g transform="rotate(144) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="135" fill="none" stroke="#1f6feb" stroke-width="1.6" opacity="0.5" stroke-dasharray="1 15 3 20 1 10" class="noscale"/>
            <circle cx="0" cy="0" r="102" fill="none" stroke="#58a6ff" stroke-width="1.4" opacity="0.7" stroke-dasharray="3 15 1 10 2 8" class="noscale"/>
            <circle cx="0" cy="-102" r="7" fill="#58a6ff" opacity="0.4" class="noscale"/>
            <circle cx="0" cy="-102" r="4" fill="#58a6ff" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="68" fill="none" stroke="#89c3ff" stroke-width="2.2" opacity="0.8" stroke-dasharray="2 8 4 12 3 10" class="noscale"/>
            <circle cx="0" cy="0" r="38" fill="none" stroke="#ffffff" stroke-width="3.0" opacity="1.0" stroke-dasharray="4 2 3 5 2 4" class="noscale"/>
          </g>
        </g>

      </g> <!-- End Global Tumble Group -->

      <!-- ════════ TRANSLUCENT WHITE GLOWING CORE ════════ -->
      <g>
        <!-- Soft Outer Translucent Halo -->
        <circle cx="0" cy="0" r="26" fill="#ffffff" opacity="0.15">
          <animate attributeName="r" values="24;28;24" dur="3s" repeatCount="indefinite"/>
        </circle>
        
        <!-- ════════ RANDOM VIRAL CORE (GITHUB SAFE) ════════ -->
      <!-- A chaotic, randomly shifting organic center using pure layered geometry -->
      <!-- We achieve the "random organic disease" look by tumbling complex biological curves, avoiding buggy SVG filters -->
      <g>
        
        <!-- Pulsing uneven biological fluid shape -->
        <path d="M 0,-15 C 10,-20 20,-5 15,10 C 10,20 -10,25 -15,10 C -25,-5 -15,-20 0,-15 Z" fill="#ffffff" opacity="0.15">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="transform" type="scale" values="1;1.3;1" dur="2.5s" repeatCount="indefinite" additive="sum"/>
        </path>

        <path d="M 0,-10 C 12,-12 15,5 8,12 C 2,18 -12,12 -10,0 C -8,-8 -5,-8 0,-10 Z" fill="#ffffff" opacity="0.3">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3s" repeatCount="indefinite"/>
        </path>
        
        <!-- Outer chaotic tendrils / network -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
          <!-- Jagged, non-circular spreading tendrils -->
          <path d="M -22,0 L -12,8 L 0,22 L 8,12 L 22,0 L 12,-8 L 0,-22 L -8,-12 Z" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 8 12 4"/>
          <path d="M -16,-16 L -5,-5 L 16,16 M -16,16 L -5,5 L 16,-16" stroke="#89c3ff" stroke-width="2" stroke-dasharray="2 6"/>
          <!-- Erratic viral orbit -->
          <path d="M -18,0 A 18 12 0 1 1 18,0 A 18 12 0 1 1 -18,0" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="8 6"/>
        </g>
        
        <!-- Absolute volatile core -->
        <circle cx="0" cy="0" r="4" fill="#ffffff">
          <animate attributeName="r" values="3;5;3" dur="0.5s" repeatCount="indefinite"/>
        </circle>
      </g>

    </g> <!-- End Right Construct -->

  </g> <!-- End Clipped Container -->

  <!-- ═══════════════ GLASS BORDER ═══════════════ -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="16" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.15"/>
</svg>