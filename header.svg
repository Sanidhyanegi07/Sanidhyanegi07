<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 800; fill: #ffffff; letter-spacing: -2px; }
      .role { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; font-weight: 500; fill: #58a6ff; letter-spacing: 4px; text-transform: uppercase; }
      .meta { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #484f58; letter-spacing: 1.5px; }
      .accent-text { fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; letter-spacing: 1px; }

      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .cursor { animation: blink 1s step-end infinite; }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010409"/>
      <stop offset="100%" stop-color="#060a10"/>
    </linearGradient>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(88,166,255,0.018)" stroke-width="0.5"/>
    </pattern>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="field-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="wide-glow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="8"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="8"/>

  <!-- Sparse floating particles -->
  <circle cx="180" cy="30" r="0.5" fill="#58a6ff" opacity="0.08"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="255" r="0.4" fill="#ffffff" opacity="0.05"><animate attributeName="opacity" values="0.03;0.08;0.03" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="25" r="0.4" fill="#58a6ff" opacity="0.06"><animate attributeName="opacity" values="0.03;0.1;0.03" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="45" r="0.3" fill="#ffffff" opacity="0.04"><animate attributeName="opacity" values="0.02;0.07;0.02" dur="9s" repeatCount="indefinite"/></circle>

  <!-- Left accent -->
  <rect x="50" y="45" width="2" height="12" fill="#58a6ff" opacity="0.7"/>
  <text x="65" y="55" class="accent-text" letter-spacing="2px">SYS.STATUS // ONLINE</text>

  <!-- Name -->
  <text x="50" y="130" class="name" fill="#58a6ff" opacity="0.04" filter="url(#wide-glow)">Sanidhya Negi</text>
  <text x="50" y="130" class="name">Sanidhya Negi</text>

  <!-- Role -->
  <text x="52" y="165" class="role">&gt; Systems Engineer<tspan class="cursor" fill="#58a6ff">_</tspan></text>

  <!-- Divider -->
  <line x1="50" y1="192" x2="190" y2="192" stroke="rgba(88,166,255,0.25)" stroke-width="0.8"/>
  <line x1="190" y1="192" x2="350" y2="192" stroke="rgba(88,166,255,0.05)" stroke-width="0.5"/>

  <!-- Tags -->
  <text x="50" y="225" class="meta" xml:space="preserve">C++   //   JAVA   //   SYSTEM DESIGN   //   DSA</text>

  <!-- ════════ GEOMETRIC CONSTRUCT ════════ -->
  <g transform="translate(770, 140)">

    <!-- Field background -->
    <circle cx="0" cy="0" r="135" fill="url(#field-glow)"/>

    <!-- Outer geodesic frame — static precision lines -->
    <!-- Hexagonal wireframe layer 1 -->
    <g opacity="0.06">
      <polygon points="0,-105 91,-52.5 91,52.5 0,105 -91,52.5 -91,-52.5" fill="none" stroke="#58a6ff" stroke-width="0.4"/>
    </g>
    <g opacity="0.04">
      <polygon points="0,-85 73.6,-42.5 73.6,42.5 0,85 -73.6,42.5 -73.6,-42.5" fill="none" stroke="#ffffff" stroke-width="0.3"/>
    </g>

    <!-- Rotating arc segments — precise, partial, not full circles -->
    <!-- Arc layer 1: outer -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <path d="M 95,0 A 95,95 0 0,1 47.5,82.3" fill="none" stroke="rgba(88,166,255,0.12)" stroke-width="0.6" stroke-linecap="round"/>
      <path d="M -95,0 A 95,95 0 0,1 -47.5,-82.3" fill="none" stroke="rgba(88,166,255,0.08)" stroke-width="0.6" stroke-linecap="round"/>
      <circle cx="95" cy="0" r="1.5" fill="#58a6ff" opacity="0.35"/>
      <circle cx="-47.5" cy="-82.3" r="1" fill="#58a6ff" opacity="0.2"/>
    </g>

    <!-- Arc layer 2: mid, counter-rotate -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="42s" repeatCount="indefinite"/>
      <path d="M 0,-72 A 72,72 0 0,1 72,0" fill="none" stroke="rgba(88,166,255,0.15)" stroke-width="0.7" stroke-linecap="round"/>
      <path d="M 0,72 A 72,72 0 0,1 -72,0" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5" stroke-linecap="round"/>
      <circle cx="72" cy="0" r="1.8" fill="#58a6ff" opacity="0.4">
        <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-72" cy="0" r="1.2" fill="#ffffff" opacity="0.15"/>
    </g>

    <!-- Arc layer 3: inner -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <path d="M 50,0 A 50,50 0 0,1 -25,43.3" fill="none" stroke="rgba(88,166,255,0.18)" stroke-width="0.6" stroke-linecap="round"/>
      <path d="M -50,0 A 50,50 0 0,1 25,-43.3" fill="none" stroke="rgba(88,166,255,0.1)" stroke-width="0.5" stroke-linecap="round"/>
      <circle cx="-25" cy="43.3" r="1.5" fill="#ffffff" opacity="0.25">
        <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Arc layer 4: tight, fast -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      <path d="M 30,0 A 30,30 0 0,1 0,30" fill="none" stroke="rgba(88,166,255,0.22)" stroke-width="0.5" stroke-linecap="round"/>
      <path d="M -30,0 A 30,30 0 0,1 0,-30" fill="none" stroke="rgba(88,166,255,0.12)" stroke-width="0.5" stroke-linecap="round"/>
      <circle cx="0" cy="30" r="1.8" fill="#58a6ff" opacity="0.5">
        <animate attributeName="opacity" values="0.35;0.65;0.35" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Connection nodes on hexagon vertices -->
    <circle cx="0" cy="-105" r="1" fill="#58a6ff" opacity="0.1"><animate attributeName="opacity" values="0.06;0.15;0.06" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="91" cy="-52.5" r="0.8" fill="#58a6ff" opacity="0.08"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="91" cy="52.5" r="0.8" fill="#ffffff" opacity="0.06"/>
    <circle cx="0" cy="105" r="1" fill="#58a6ff" opacity="0.08"><animate attributeName="opacity" values="0.05;0.12;0.05" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="-91" cy="52.5" r="0.8" fill="#ffffff" opacity="0.05"/>
    <circle cx="-91" cy="-52.5" r="0.8" fill="#58a6ff" opacity="0.07"/>

    <!-- Cross-hair precision lines through center -->
    <line x1="-18" y1="0" x2="-8" y2="0" stroke="rgba(88,166,255,0.15)" stroke-width="0.4"/>
    <line x1="8" y1="0" x2="18" y2="0" stroke="rgba(88,166,255,0.15)" stroke-width="0.4"/>
    <line x1="0" y1="-18" x2="0" y2="-8" stroke="rgba(88,166,255,0.15)" stroke-width="0.4"/>
    <line x1="0" y1="8" x2="0" y2="18" stroke="rgba(88,166,255,0.15)" stroke-width="0.4"/>

    <!-- Core glow -->
    <circle cx="0" cy="0" r="22" fill="url(#core-glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Core ring -->
    <circle cx="0" cy="0" r="6" fill="none" stroke="rgba(88,166,255,0.2)" stroke-width="0.5">
      <animate attributeName="r" values="6;8;6" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Center -->
    <circle cx="0" cy="0" r="4.5" fill="#58a6ff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.9"/>

  </g>
</svg>
