<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 48px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -2px;
      }
      .role {
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 14px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 11px;
        fill: #6e7681;
        letter-spacing: 2px;
      }
      .accent-text {
        fill: #58a6ff;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 10px;
        letter-spacing: 2px;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
    </style>

    <!-- Strict Card Boundary: NOTHING ever goes outside -->
    <clipPath id="card-bounds">
      <rect x="0" y="0" width="1000" height="280" rx="12"/>
    </clipPath>

    <!-- Crisp Dark Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="50%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#03050b"/>
    </linearGradient>

    <!-- Subtle Technical Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(88, 166, 255, 0.03)" stroke-width="0.5"/>
      <circle cx="40" cy="40" r="0.8" fill="rgba(88, 166, 255, 0.08)"/>
    </pattern>

    <!-- Center Translucent Void Shader -->
    <radialGradient id="void-shade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#010204" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#03060f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- ═══════════════ CLIPPED CONTENT (ZERO SPILL) ═══════════════ -->
  <g clip-path="url(#card-bounds)">
    <!-- Background Canvas -->
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <rect width="100%" height="100%" fill="url(#grid)"/>

    <!-- Pin-sharp Background Stars (No Blobs) -->
    <circle cx="90" cy="80" r="0.6" fill="#ffffff" opacity="0.3"/>
    <circle cx="140" cy="220" r="0.5" fill="#58a6ff" opacity="0.35"/>
    <circle cx="260" cy="60" r="0.7" fill="#ffffff" opacity="0.4"/>
    <circle cx="340" cy="180" r="0.5" fill="#58a6ff" opacity="0.25"/>
    <circle cx="430" cy="40" r="0.8" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="490" cy="240" r="0.6" fill="#58a6ff" opacity="0.3"/>
    <circle cx="580" cy="90" r="0.5" fill="#ffffff" opacity="0.35"/>
    <circle cx="650" cy="230" r="0.7" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="40" r="0.8" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="230" r="0.6" fill="#58a6ff" opacity="0.35"/>

    <!-- ═══════════════ LEFT: CLEAN SYSTEMS INTERFACE ═══════════════ -->

    <!-- Top-left Status Indicator -->
    <rect x="50" y="45" width="2" height="12" fill="#58a6ff" opacity="0.9"/>
    <circle cx="51" cy="51" r="3" fill="#58a6ff" opacity="0.3">
      <animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="65" y="55" class="accent-text">SYS.STATUS // ONLINE</text>

    <!-- Name & Role -->
    <text x="50" y="130" class="name">Sanidhya Negi</text>
    <text x="52" y="165" class="role">&gt; Systems Engineer<tspan class="cursor" fill="#58a6ff">_</tspan></text>

    <!-- Precision Divider Line -->
    <line x1="50" y1="195" x2="190" y2="195" stroke="#58a6ff" stroke-width="1" opacity="0.4"/>
    <line x1="190" y1="195" x2="330" y2="195" stroke="#58a6ff" stroke-width="0.5" opacity="0.12"/>
    <line x1="330" y1="195" x2="400" y2="195" stroke="#58a6ff" stroke-width="0.3" opacity="0.04" stroke-dasharray="2 4"/>

    <!-- Tech Stack Tags -->
    <text x="50" y="230" class="meta" xml:space="preserve">C++   <tspan fill="#58a6ff" opacity="0.8">//</tspan>   JAVA   <tspan fill="#58a6ff" opacity="0.8">//</tspan>   SYSTEM DESIGN   <tspan fill="#58a6ff" opacity="0.8">//</tspan>   DSA</text>

    <!-- ═══════════════ RIGHT: PRECISION BLACK HOLE & ORBITAL CONSTRUCT ═══════════════ -->
    <g transform="translate(775, 140)">

      <!-- ── 7 SPACETIME LENSING LINES (60% Background / 40% Theme Blend `#202f44`) ── -->
      <!-- Clean, subtle curvature lines with sharp pinpoint terminal dots -->
      <!-- Line 1: Shortest -->
      <g>
        <path d="M -28,15 Q 0,10 28,15" fill="none" stroke="#253952" stroke-width="0.75" opacity="0.8"/>
        <circle cx="-28" cy="15" r="1.1" fill="#58a6ff" opacity="0.9"/>
        <circle cx="28" cy="15" r="1.1" fill="#58a6ff" opacity="0.9"/>
      </g>

      <!-- Line 2 -->
      <g>
        <path d="M -40,-19 Q 0,-13 40,-19" fill="none" stroke="#1f2f45" stroke-width="0.7" opacity="0.75"/>
        <circle cx="-40" cy="-19" r="1.0" fill="#ffffff" opacity="0.85"/>
        <circle cx="40" cy="-19" r="1.0" fill="#58a6ff" opacity="0.85"/>
      </g>

      <!-- Line 3 -->
      <g>
        <path d="M -54,25 Q 0,17 54,25" fill="none" stroke="#263b57" stroke-width="0.75" opacity="0.75"/>
        <circle cx="-54" cy="25" r="1.2" fill="#58a6ff" opacity="0.9"/>
        <circle cx="54" cy="25" r="1.2" fill="#ffffff" opacity="0.85"/>
      </g>

      <!-- Line 4 -->
      <g>
        <path d="M -68,-29 Q 0,-20 68,-29" fill="none" stroke="#1d2d42" stroke-width="0.65" opacity="0.7"/>
        <circle cx="-68" cy="-29" r="1.0" fill="#58a6ff" opacity="0.8"/>
        <circle cx="68" cy="-29" r="1.0" fill="#ffffff" opacity="0.8"/>
      </g>

      <!-- Line 5 -->
      <g>
        <path d="M -82,35 Q 0,23 82,35" fill="none" stroke="#243750" stroke-width="0.65" opacity="0.7"/>
        <circle cx="-82" cy="35" r="1.1" fill="#ffffff" opacity="0.85"/>
        <circle cx="82" cy="35" r="1.1" fill="#58a6ff" opacity="0.85"/>
      </g>

      <!-- Line 6 -->
      <g>
        <path d="M -96,-41 Q 0,-28 96,-41" fill="none" stroke="#1b2a3d" stroke-width="0.6" opacity="0.65"/>
        <circle cx="-96" cy="-41" r="1.0" fill="#58a6ff" opacity="0.75"/>
        <circle cx="96" cy="-41" r="1.0" fill="#58a6ff" opacity="0.75"/>
      </g>

      <!-- Line 7: Longest -->
      <g>
        <path d="M -110,47 Q 0,31 110,47" fill="none" stroke="#21334b" stroke-width="0.6" opacity="0.6"/>
        <circle cx="-110" cy="47" r="1.1" fill="#58a6ff" opacity="0.8"/>
        <circle cx="110" cy="47" r="1.1" fill="#ffffff" opacity="0.8"/>
      </g>

      <!-- ── 4 ORBITAL RINGS (Sleek Mechanical Precision) ── -->

      <!-- Ring 1: Outer Dashed Equator (Slow 45s) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="122" ry="36" stroke="rgba(88,166,255,0.22)" stroke-width="0.5" fill="none" stroke-dasharray="3 8"/>
        <circle cx="122" cy="0" r="1.8" fill="#58a6ff" opacity="0.85"/>
        <circle cx="-80" cy="0" r="1.0" fill="#ffffff" opacity="0.5"/>
      </g>

      <!-- Ring 2: Tilted Mid Ring (Counter-rotating 30s) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="82" ry="24" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" fill="none"/>
        <circle cx="82" cy="0" r="1.8" fill="#ffffff" opacity="0.8"/>
        <circle cx="-82" cy="0" r="1.6" fill="#58a6ff" opacity="0.7"/>
      </g>

      <!-- Ring 3: Steep Inclination (20s) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="46" ry="46" stroke="rgba(88,166,255,0.3)" stroke-width="0.5" fill="none" stroke-dasharray="4 4" transform="rotate(35)"/>
        <circle cx="46" cy="0" r="2.0" fill="#58a6ff" transform="rotate(35)"/>
      </g>

      <!-- Ring 4: Inner Rapid Track (12s) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="28" ry="20" stroke="rgba(88,166,255,0.35)" stroke-width="0.6" fill="none" transform="rotate(-20)"/>
        <circle cx="28" cy="0" r="1.4" fill="#ffffff" opacity="0.9" transform="rotate(-20)"/>
      </g>

      <!-- ── BLACK HOLE SINGULARITY: Translucent Void & Photon Ring ── -->
      <!-- Faint Outer Ambient Core Field -->
      <circle cx="0" cy="0" r="26" fill="#58a6ff" opacity="0.04"/>

      <!-- Translucent Event Horizon -->
      <circle cx="0" cy="0" r="14" fill="url(#void-shade)"/>

      <!-- Razor-Sharp Photon Ring -->
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.9">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#58a6ff" stroke-width="0.4" opacity="0.5"/>

      <!-- Center Point -->
      <circle cx="0" cy="0" r="2" fill="#58a6ff" opacity="0.95"/>
      <circle cx="0" cy="0" r="0.8" fill="#ffffff" opacity="1"/>

    </g> <!-- End of right group -->
  </g> <!-- End of clipped container -->

  <!-- ═══════════════ CRISP CARD BORDER (EXACT PERIMETER) ═══════════════ -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="12" fill="none" stroke="rgba(88, 166, 255, 0.18)" stroke-width="1"/>
</svg>
