<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 50px;
        font-weight: 800;
        fill: #f8fafc;
        letter-spacing: -2px;
      }
      .role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 5px;
        text-transform: uppercase;
      }
      .tag {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 9px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 2.5px;
      }
      .hud-sub {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 8px;
        fill: #7d8590;
        letter-spacing: 1.5px;
      }
      .pill-bg {
        fill: rgba(10, 14, 23, 0.8);
        stroke: rgba(88, 166, 255, 0.25);
        stroke-width: 0.75;
      }
      .skill-txt {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 9px;
        font-weight: 500;
        fill: #cbd5e1;
        letter-spacing: 1.5px;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1.1s step-end infinite; }
    </style>

    <!-- Deep Multi-Scale Optical Bloom Filters -->
    <filter id="core-flare" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b3"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="b4"/>
      <feMerge>
        <feMergeNode in="b4"/>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nebula-soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="nebula-med"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="nebula-broad"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="nebula-deep"><feGaussianBlur stdDeviation="36"/></filter>

    <!-- Deep Space Interstellar Vacuum Gradient -->
    <linearGradient id="deep-space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="45%" stop-color="#040814"/>
      <stop offset="85%" stop-color="#071024"/>
      <stop offset="100%" stop-color="#03050d"/>
    </linearGradient>

    <!-- Photorealistic Galactic Nucleus Shader -->
    <radialGradient id="galactic-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="8%" stop-color="#f8fafc" stop-opacity="0.95"/>
      <stop offset="22%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="90%" stop-color="#1d4ed8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Galactic Corona Atmosphere -->
    <radialGradient id="galactic-corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#020409" stop-opacity="0"/>
    </radialGradient>

    <!-- Arm Gas Cloud Gradient 1 -->
    <linearGradient id="arm-gas-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#bae6fd" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>

    <!-- Arm Gas Cloud Gradient 2 -->
    <linearGradient id="arm-gas-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="90%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════ CANVAS FOUNDATION ═══════════════ -->
  <rect width="100%" height="100%" fill="url(#deep-space)" rx="8"/>

  <!-- Macro Atmospheric Galactic Glow -->
  <ellipse cx="760" cy="138" rx="220" ry="105" fill="url(#galactic-corona)" filter="url(#nebula-deep)" transform="rotate(-16, 760, 138)"/>
  <ellipse cx="770" cy="136" rx="150" ry="65" fill="#38bdf8" opacity="0.05" filter="url(#nebula-broad)" transform="rotate(-18, 770, 136)"/>

  <!-- ═══════════════ DEEP COSMIC STAR DUST FIELD ═══════════════ -->
  <!-- Layered microscopic background stars -->
  <g opacity="0.8">
    <circle cx="20" cy="35" r="0.3" fill="#fff" opacity="0.3"/>
    <circle cx="48" cy="190" r="0.25" fill="#7dd3fc" opacity="0.4"/>
    <circle cx="82" cy="115" r="0.2" fill="#fff" opacity="0.25"/>
    <circle cx="115" cy="30" r="0.35" fill="#fff" opacity="0.3"/>
    <circle cx="145" cy="235" r="0.25" fill="#38bdf8" opacity="0.35"/>
    <circle cx="175" cy="80" r="0.2" fill="#fff" opacity="0.2"/>
    <circle cx="210" cy="165" r="0.3" fill="#fff" opacity="0.35"/>
    <circle cx="245" cy="50" r="0.25" fill="#7dd3fc" opacity="0.3"/>
    <circle cx="280" cy="220" r="0.35" fill="#fff" opacity="0.25"/>
    <circle cx="315" cy="105" r="0.2" fill="#fff" opacity="0.3"/>
    <circle cx="350" cy="255" r="0.3" fill="#38bdf8" opacity="0.35"/>
    <circle cx="385" cy="35" r="0.25" fill="#fff" opacity="0.4"/>
    <circle cx="420" cy="185" r="0.3" fill="#fff" opacity="0.25"/>
    <circle cx="455" cy="75" r="0.2" fill="#7dd3fc" opacity="0.3"/>
    <circle cx="490" cy="230" r="0.35" fill="#fff" opacity="0.35"/>
    <circle cx="525" cy="140" r="0.25" fill="#fff" opacity="0.25"/>
    <circle cx="560" cy="25" r="0.3" fill="#38bdf8" opacity="0.3"/>
    <circle cx="595" cy="210" r="0.2" fill="#fff" opacity="0.35"/>
    <circle cx="630" cy="70" r="0.35" fill="#fff" opacity="0.25"/>
    <circle cx="665" cy="175" r="0.25" fill="#7dd3fc" opacity="0.3"/>
    <circle cx="700" cy="250" r="0.3" fill="#fff" opacity="0.35"/>
    <circle cx="830" cy="30" r="0.3" fill="#fff" opacity="0.4"/>
    <circle cx="865" cy="245" r="0.35" fill="#38bdf8" opacity="0.3"/>
    <circle cx="905" cy="60" r="0.25" fill="#fff" opacity="0.25"/>
    <circle cx="940" cy="195" r="0.3" fill="#fff" opacity="0.4"/>
    <circle cx="975" cy="115" r="0.25" fill="#7dd3fc" opacity="0.35"/>
  </g>

  <!-- Twinkling foreground beacons -->
  <circle cx="150" cy="45" r="0.85" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="285" cy="240" r="0.75" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="435" cy="28" r="0.85" fill="#ffffff">
    <animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="610" cy="250" r="0.8" fill="#7dd3fc">
    <animate attributeName="opacity" values="0.25;0.9;0.25" dur="6.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="40" r="0.85" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══════════════ REALISTIC 3D SPIRAL GALAXY ═══════════════ -->
  <g transform="translate(760, 138)">

    <!-- ── SLOW ROTATION OF THE ENTIRE GALACTIC PLANE ── -->
    <g transform="rotate(-16)">
      <animateTransform attributeName="transform" type="rotate" from="-16" to="344" dur="80s" repeatCount="indefinite"/>

      <!-- 1. Diffuse Stellar Disk Base (Continuous unresolved starlight) -->
      <ellipse cx="0" cy="0" rx="180" ry="58" fill="#0369a1" opacity="0.04" filter="url(#nebula-broad)"/>
      <ellipse cx="0" cy="0" rx="155" ry="50" fill="#38bdf8" opacity="0.07" filter="url(#nebula-med)"/>
      <ellipse cx="0" cy="0" rx="125" ry="38" fill="#bae6fd" opacity="0.12" filter="url(#nebula-soft)"/>

      <!-- 2. MAJOR SPIRAL ARM A: Diffuse Gas Plumes + Stellar Nurseries -->
      <!-- Broad gas cloud stream -->
      <path d="M 0,0 Q 42,-14 90,-18 Q 138,-20 162,2 Q 176,22 144,40 Q 106,52 38,44" 
            fill="none" stroke="url(#arm-gas-1)" stroke-width="22" opacity="0.18" filter="url(#nebula-broad)"/>
      <!-- Dense star-forming mid-lane -->
      <path d="M 0,0 Q 42,-14 90,-18 Q 138,-20 162,2 Q 176,22 144,40 Q 106,52 38,44" 
            fill="none" stroke="url(#arm-gas-1)" stroke-width="10" opacity="0.45" filter="url(#nebula-med)"/>
      <!-- Crisp core luminous ridge -->
      <path d="M 0,0 Q 42,-14 90,-18 Q 138,-20 162,2 Q 176,22 144,40 Q 106,52 38,44" 
            fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.75" filter="url(#nebula-soft)"/>
      <path d="M 0,0 Q 42,-14 90,-18 Q 138,-20 162,2 Q 176,22 144,40 Q 106,52 38,44" 
            fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.85"/>

      <!-- 3. MAJOR SPIRAL ARM B: Counter Gas Stream -->
      <!-- Broad gas cloud stream -->
      <path d="M 0,0 Q -42,14 -90,18 Q -138,20 -162,-2 Q -176,-22 -144,-40 Q -106,-52 -38,-44" 
            fill="none" stroke="url(#arm-gas-2)" stroke-width="22" opacity="0.18" filter="url(#nebula-broad)"/>
      <!-- Dense star-forming mid-lane -->
      <path d="M 0,0 Q -42,14 -90,18 Q -138,20 -162,-2 Q -176,-22 -144,-40 Q -106,-52 -38,-44" 
            fill="none" stroke="url(#arm-gas-2)" stroke-width="10" opacity="0.45" filter="url(#nebula-med)"/>
      <!-- Crisp core luminous ridge -->
      <path d="M 0,0 Q -42,14 -90,18 Q -138,20 -162,-2 Q -176,-22 -144,-40 Q -106,-52 -38,-44" 
            fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.75" filter="url(#nebula-soft)"/>
      <path d="M 0,0 Q -42,14 -90,18 Q -138,20 -162,-2 Q -176,-22 -144,-40 Q -106,-52 -38,-44" 
            fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.85"/>

      <!-- 4. SECONDARY SPIRAL SPURS & INTER-ARM BRIDGES -->
      <path d="M 65,-16 Q 96,-5 116,14" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.25" filter="url(#nebula-soft)"/>
      <path d="M -65,16 Q -96,5 -116,-14" fill="none" stroke="#7dd3fc" stroke-width="3" opacity="0.25" filter="url(#nebula-soft)"/>

      <!-- 5. REALISTIC DARK INTERSTELLAR DUST EXTINCTION LANES (Absorptive Silhouettes) -->
      <!-- These dark dust bands wind right through the glowing arms, creating photographic realism -->
      <path d="M 10,-3 Q 48,-15 95,-17 Q 140,-15 156,6" fill="none" stroke="#030611" stroke-width="3.2" opacity="0.85" filter="url(#nebula-soft)"/>
      <path d="M 14,-3 Q 50,-15 95,-17 Q 140,-15 156,6" fill="none" stroke="#010308" stroke-width="1.4" opacity="0.95"/>
      <path d="M -10,3 Q -48,15 -95,17 Q -140,15 -156,-6" fill="none" stroke="#030611" stroke-width="3.2" opacity="0.85" filter="url(#nebula-soft)"/>
      <path d="M -14,3 Q -50,15 -95,17 Q -140,15 -156,-6" fill="none" stroke="#010308" stroke-width="1.4" opacity="0.95"/>

      <!-- 6. H II REGIONS & BLUE SUPERGIANT STAR CLUSTERS (Knots of light) -->
      <!-- Arm A star clusters -->
      <circle cx="48" cy="-14" r="1.8" fill="#ffffff" opacity="0.95"/>
      <circle cx="48" cy="-14" r="5" fill="#38bdf8" opacity="0.45" filter="url(#nebula-soft)"/>
      <circle cx="92" cy="-19" r="2.1" fill="#bae6fd" opacity="0.9"/>
      <circle cx="132" cy="-18" r="1.6" fill="#ffffff" opacity="0.85"/>
      <circle cx="158" cy="-1" r="2.4" fill="#38bdf8" opacity="0.95"/>
      <circle cx="158" cy="-1" r="6" fill="#0284c7" opacity="0.35" filter="url(#nebula-soft)"/>
      <circle cx="162" cy="20" r="1.7" fill="#ffffff" opacity="0.8"/>
      <circle cx="132" cy="41" r="2.0" fill="#7dd3fc" opacity="0.85"/>
      <circle cx="88" cy="48" r="1.4" fill="#ffffff" opacity="0.7"/>

      <!-- Arm B star clusters -->
      <circle cx="-48" cy="14" r="1.8" fill="#ffffff" opacity="0.95"/>
      <circle cx="-48" cy="14" r="5" fill="#38bdf8" opacity="0.45" filter="url(#nebula-soft)"/>
      <circle cx="-92" cy="19" r="2.1" fill="#bae6fd" opacity="0.9"/>
      <circle cx="-132" cy="18" r="1.6" fill="#ffffff" opacity="0.85"/>
      <circle cx="-158" cy="1" r="2.4" fill="#38bdf8" opacity="0.95"/>
      <circle cx="-158" cy="1" r="6" fill="#0284c7" opacity="0.35" filter="url(#nebula-soft)"/>
      <circle cx="-162" cy="-20" r="1.7" fill="#ffffff" opacity="0.8"/>
      <circle cx="-132" cy="-41" r="2.0" fill="#7dd3fc" opacity="0.85"/>
      <circle cx="-88" cy="-48" r="1.4" fill="#ffffff" opacity="0.7"/>

      <!-- Globular Cluster Satellite in Orbit -->
      <g>
        <circle cx="142" cy="-44" r="2.6" fill="#ffffff" opacity="0.9" filter="url(#nebula-soft)"/>
        <circle cx="142" cy="-44" r="6.5" fill="#38bdf8" opacity="0.3" filter="url(#nebula-med)"/>
        <circle cx="145" cy="-42" r="1.1" fill="#7dd3fc" opacity="0.95"/>
        <circle cx="139" cy="-46" r="0.9" fill="#fff" opacity="0.8"/>
      </g>
    </g> <!-- End of rotating galaxy plane -->

    <!-- ── FAST-SPINNING INNER NUCLEAR STAR DISK ── -->
    <g transform="rotate(-16)">
      <animateTransform attributeName="transform" type="rotate" from="-16" to="344" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="70" ry="22" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.3" filter="url(#nebula-soft)"/>
      <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="#e0f2fe" stroke-width="2.2" opacity="0.65" filter="url(#nebula-soft)"/>
      <circle cx="46" cy="0" r="1.8" fill="#ffffff" opacity="0.95"/>
      <circle cx="-46" cy="0" r="1.8" fill="#38bdf8" opacity="0.95"/>
      <circle cx="0" cy="14" r="1.3" fill="#7dd3fc" opacity="0.85"/>
      <circle cx="0" cy="-14" r="1.3" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- ── LUMINOUS GALACTIC BULGE & CORE BLOOM (Photographic Overexposure) ── -->
    <ellipse cx="0" cy="0" rx="44" ry="15" fill="url(#galactic-core-glow)" filter="url(#core-flare)" transform="rotate(-16)"/>
    <ellipse cx="0" cy="0" rx="24" ry="8" fill="#ffffff" opacity="0.95" filter="url(#nebula-soft)" transform="rotate(-16)"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" opacity="1"/>

    <!-- Central Supermassive Singularity Shadow Ring -->
    <circle cx="0" cy="0" r="2.8" fill="#020409"/>
    <circle cx="0" cy="0" r="3.4" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.95">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.2s" repeatCount="indefinite"/>
    </circle>

  </g> <!-- End of 3D Galaxy -->

  <!-- ═══════════════ LEFT INTERFACE: SLEEK ENGINEERING UI ═══════════════ -->

  <!-- Top Telemetry Status Beacon -->
  <g transform="translate(48, 42)">
    <rect x="0" y="0" width="232" height="22" rx="11" fill="rgba(10, 14, 23, 0.8)" stroke="rgba(88, 166, 255, 0.25)" stroke-width="0.8"/>
    <!-- Sonar Radar Pulse Beacon -->
    <circle cx="13" cy="11" r="3" fill="#58a6ff"/>
    <circle cx="13" cy="11" r="3" fill="none" stroke="#58a6ff" stroke-width="0.8">
      <animate attributeName="r" values="3;9;3" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="13" cy="11" r="5.5" fill="#58a6ff" opacity="0.25" filter="url(#nebula-soft)"/>
    <text x="25" y="14" class="tag">SYS.STATUS // ONLINE</text>
    <line x1="165" y1="6" x2="165" y2="16" stroke="rgba(88, 166, 255, 0.2)" stroke-width="1"/>
    <text x="175" y="14" class="hud-sub">CORE 64b</text>
  </g>

  <!-- Developer Identity: Headline with Soft Ambient Luminance -->
  <text x="48" y="122" class="name" fill="#58a6ff" opacity="0.15" filter="url(#core-flare)">Sanidhya Negi</text>
  <text x="48" y="122" class="name">Sanidhya Negi</text>

  <!-- Sub-headline: Role with Terminal Cursor -->
  <g transform="translate(49, 154)">
    <text class="role"><tspan fill="#58a6ff" font-weight="700">&gt;</tspan> Systems Engineer<tspan class="cursor" fill="#58a6ff">_</tspan></text>
  </g>

  <!-- Technical Active Telemetry Divider Line -->
  <g>
    <!-- Anchor Node -->
    <circle cx="49" cy="175" r="2" fill="#58a6ff" opacity="0.85"/>
    <circle cx="49" cy="175" r="4.5" fill="#58a6ff" opacity="0.2" filter="url(#nebula-soft)"/>
    <!-- Main Line -->
    <line x1="49" y1="175" x2="170" y2="175" stroke="#58a6ff" stroke-width="0.85" opacity="0.4"/>
    <line x1="170" y1="175" x2="310" y2="175" stroke="#388bfd" stroke-width="0.5" opacity="0.15"/>
    <line x1="310" y1="175" x2="420" y2="175" stroke="#58a6ff" stroke-width="0.3" opacity="0.04" stroke-dasharray="2 4"/>
    <!-- Moving Data Packet Pulse along the Line toward Galactic Inflow -->
    <circle cy="175" r="1.4" fill="#ffffff">
      <animate attributeName="cx" values="49;410;49" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Core Competency High-Tech Badges -->
  <g transform="translate(49, 196)">
    <!-- Pill 1: C++ -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="46" height="18" rx="4" class="pill-bg"/>
      <text x="23" y="12" class="skill-txt" text-anchor="middle">C++</text>
    </g>

    <!-- Pill 2: JAVA -->
    <g transform="translate(54, 0)">
      <rect x="0" y="0" width="54" height="18" rx="4" class="pill-bg"/>
      <text x="27" y="12" class="skill-txt" text-anchor="middle">JAVA</text>
    </g>

    <!-- Pill 3: SYSTEM DESIGN -->
    <g transform="translate(116, 0)">
      <rect x="0" y="0" width="118" height="18" rx="4" class="pill-bg"/>
      <text x="59" y="12" class="skill-txt" text-anchor="middle">SYSTEM DESIGN</text>
    </g>

    <!-- Pill 4: DSA -->
    <g transform="translate(242, 0)">
      <rect x="0" y="0" width="46" height="18" rx="4" class="pill-bg"/>
      <text x="23" y="12" class="skill-txt" text-anchor="middle">DSA</text>
    </g>
  </g>

</svg>
