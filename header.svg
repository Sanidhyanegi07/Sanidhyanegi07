<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 46px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -2px;
      }
      .role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #f59e0b;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .tag {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 9px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 2px;
      }
      .hud-sub {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 8px;
        fill: #94a3b8;
        letter-spacing: 1.5px;
      }
      .meta {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 2px;
      }
      .hud-metric {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 7.5px;
        fill: #64748b;
        letter-spacing: 1.5px;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1.1s step-end infinite; }
    </style>

    <!-- Strict Card Perimeter: ZERO bleed outside rounded rectangle -->
    <clipPath id="card-bounds">
      <rect x="0" y="0" width="1000" height="280" rx="12"/>
    </clipPath>

    <!-- Upper Half Mask for Lensed Top Halo -->
    <clipPath id="upper-half">
      <rect x="-250" y="-200" width="500" height="200"/>
    </clipPath>

    <!-- Lower Half Mask for Lensed Bottom Halo -->
    <clipPath id="lower-half">
      <rect x="-250" y="0" width="500" height="200"/>
    </clipPath>

    <!-- Deep Space Vacuum Background -->
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020307"/>
      <stop offset="50%" stop-color="#04060e"/>
      <stop offset="85%" stop-color="#070914"/>
      <stop offset="100%" stop-color="#020205"/>
    </linearGradient>

    <!-- Relativistic Gold Accretion Gradient (Left is Blazing White Doppler; Right is Dim Amber) -->
    <linearGradient id="doppler-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#92400e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Optical Bloom Filters for Pure Vector Radiation -->
    <filter id="vector-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="ambient-glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <!-- ═══════════════ STRICTLY CLIPPED CANVAS ═══════════════ -->
  <g clip-path="url(#card-bounds)">
    <!-- Deep Space Vacuum -->
    <rect width="100%" height="100%" fill="url(#space-bg)"/>

    <!-- Ambient Radiation from Gargantua -->
    <circle cx="780" cy="140" r="120" fill="#f59e0b" opacity="0.04" filter="url(#ambient-glow)"/>
    <circle cx="740" cy="140" r="60" fill="#ffffff" opacity="0.03" filter="url(#ambient-glow)"/>

    <!-- Pin-Sharp Astrometric Stars (Strictly inside boundary) -->
    <g opacity="0.75">
      <circle cx="35" cy="40" r="0.4" fill="#fff" opacity="0.3"/>
      <circle cx="75" cy="210" r="0.35" fill="#fef08a" opacity="0.35"/>
      <circle cx="120" cy="120" r="0.3" fill="#fff" opacity="0.25"/>
      <circle cx="165" cy="245" r="0.4" fill="#fff" opacity="0.3"/>
      <circle cx="210" cy="55" r="0.35" fill="#58a6ff" opacity="0.35"/>
      <circle cx="260" cy="170" r="0.4" fill="#fff" opacity="0.25"/>
      <circle cx="310" cy="70" r="0.35" fill="#fff" opacity="0.4"/>
      <circle cx="360" cy="235" r="0.35" fill="#fef08a" opacity="0.35"/>
      <circle cx="410" cy="45" r="0.35" fill="#fff" opacity="0.3"/>
      <circle cx="460" cy="190" r="0.3" fill="#fff" opacity="0.25"/>
      <circle cx="510" cy="80" r="0.4" fill="#58a6ff" opacity="0.3"/>
      <circle cx="560" cy="245" r="0.35" fill="#fff" opacity="0.35"/>
      <circle cx="920" cy="45" r="0.4" fill="#fff" opacity="0.4"/>
      <circle cx="950" cy="225" r="0.4" fill="#fef08a" opacity="0.3"/>
      <circle cx="975" cy="90" r="0.3" fill="#fff" opacity="0.3"/>

      <!-- Twinkling Astrometric Reference Points -->
      <circle cx="180" cy="65" r="0.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340" cy="250" r="0.75" fill="#fef08a">
        <animate attributeName="opacity" values="0.25;0.9;0.25" dur="5.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="35" r="0.85" fill="#ffffff">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="935" cy="50" r="0.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ═══════════════ THE PURE VECTOR GARGANTUA SYSTEM (ANIMATED) ═══════════════ -->
    <!-- Positioned cleanly at (780, 140) with 50px top/bottom buffer and 250px left space -->
    <g transform="translate(780, 140)">

      <!-- ── 7 SPACETIME GEODESIC CURVATURE LINES (60% Background / 40% Theme Blend) ── -->
      <!-- Clean, disciplined lines with sharp terminal dots -->
      <!-- Line 1: Inner (Shortest) -->
      <g>
        <path d="M -26,14 Q 0,10 26,14" fill="none" stroke="#2a3d54" stroke-width="0.8" opacity="0.85"/>
        <circle cx="-26" cy="14" r="1.1" fill="#58a6ff" opacity="0.9"/>
        <circle cx="26" cy="14" r="1.1" fill="#58a6ff" opacity="0.9"/>
      </g>

      <!-- Line 2 -->
      <g>
        <path d="M -38,-17 Q 0,-12 38,-17" fill="none" stroke="#223348" stroke-width="0.75" opacity="0.8"/>
        <circle cx="-38" cy="-17" r="1.0" fill="#ffffff" opacity="0.85"/>
        <circle cx="38" cy="-17" r="1.0" fill="#58a6ff" opacity="0.85"/>
      </g>

      <!-- Line 3 -->
      <g>
        <path d="M -50,22 Q 0,15 50,22" fill="none" stroke="#2d425c" stroke-width="0.75" opacity="0.8"/>
        <circle cx="-50" cy="22" r="1.2" fill="#58a6ff" opacity="0.9"/>
        <circle cx="50" cy="22" r="1.2" fill="#ffffff" opacity="0.85"/>
      </g>

      <!-- Line 4 -->
      <g>
        <path d="M -62,-26 Q 0,-18 62,-26" fill="none" stroke="#1f3044" stroke-width="0.7" opacity="0.75"/>
        <circle cx="-62" cy="-26" r="1.0" fill="#58a6ff" opacity="0.8"/>
        <circle cx="62" cy="-26" r="1.0" fill="#ffffff" opacity="0.8"/>
      </g>

      <!-- Line 5 -->
      <g>
        <path d="M -74,31 Q 0,21 74,31" fill="none" stroke="#263a54" stroke-width="0.7" opacity="0.75"/>
        <circle cx="-74" cy="31" r="1.1" fill="#ffffff" opacity="0.85"/>
        <circle cx="74" cy="31" r="1.1" fill="#58a6ff" opacity="0.85"/>
      </g>

      <!-- Line 6 -->
      <g>
        <path d="M -86,-36 Q 0,-25 86,-36" fill="none" stroke="#1c2a3c" stroke-width="0.65" opacity="0.7"/>
        <circle cx="-86" cy="-36" r="1.0" fill="#58a6ff" opacity="0.75"/>
        <circle cx="86" cy="-36" r="1.0" fill="#58a6ff" opacity="0.75"/>
      </g>

      <!-- Line 7: Outermost (Longest) -->
      <g>
        <path d="M -98,41 Q 0,27 98,41" fill="none" stroke="#24374e" stroke-width="0.65" opacity="0.65"/>
        <circle cx="-98" cy="41" r="1.2" fill="#58a6ff" opacity="0.85"/>
        <circle cx="98" cy="41" r="1.2" fill="#ffffff" opacity="0.85"/>
      </g>

      <!-- ── 1. UPPER LENSED HALO (Mathematical Geodesic Arch Over Event Horizon) ── -->
      <!-- Clipped strictly to upper half for pure mathematical symmetry -->
      <g clip-path="url(#upper-half)">
        <!-- Broad thermal golden halo -->
        <ellipse cx="0" cy="0" rx="88" ry="80" fill="none" stroke="#b45309" stroke-width="14" opacity="0.25" filter="url(#soft-glow)"/>
        <!-- Mid incandescent gold arch -->
        <ellipse cx="0" cy="0" rx="86" ry="78" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.6" filter="url(#soft-glow)"/>
        <ellipse cx="0" cy="0" rx="84" ry="76" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.85"/>
        <!-- Razor-sharp white-hot crest -->
        <ellipse cx="0" cy="0" rx="82.5" ry="74.5" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.95"/>
      </g>

      <!-- ── 2. LOWER LENSED HALO (Mirror Image Under Event Horizon) ── -->
      <!-- Clipped strictly to lower half -->
      <g clip-path="url(#lower-half)">
        <ellipse cx="0" cy="0" rx="74" ry="66" fill="none" stroke="#b45309" stroke-width="10" opacity="0.2" filter="url(#soft-glow)"/>
        <ellipse cx="0" cy="0" rx="72" ry="64" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.5"/>
        <ellipse cx="0" cy="0" rx="70.5" ry="62.5" fill="none" stroke="#fef08a" stroke-width="1.1" opacity="0.75"/>
      </g>

      <!-- ── 3. THE EVENT HORIZON SHADOW (Absolute Black Void) ── -->
      <!-- Perfectly circular physical shadow with radius = 40px -->
      <circle cx="0" cy="0" r="40" fill="#010204"/>

      <!-- ── 4. THE CRITICAL OPTICAL PHOTON RING ── -->
      <!-- Razor-thin circle right at the event horizon boundary -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.95">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#f59e0b" stroke-width="2.2" opacity="0.4" filter="url(#soft-glow)"/>

      <!-- ── 5. EQUATORIAL ACCRETION DISK (PASSING ACROSS FRONT OF HORIZON) ── -->
      <!-- Symmetrical concentric density striations inclined across the equator -->

      <!-- Broad thermal disk envelope -->
      <ellipse cx="0" cy="0" rx="142" ry="14" fill="none" stroke="url(#doppler-flow)" stroke-width="14" opacity="0.25" filter="url(#soft-glow)"/>

      <!-- Concentric plasma striations -->
      <ellipse cx="0" cy="0" rx="134" ry="12.5" fill="none" stroke="url(#doppler-flow)" stroke-width="5" opacity="0.55" filter="url(#soft-glow)"/>
      <ellipse cx="0" cy="0" rx="122" ry="10.8" fill="none" stroke="url(#doppler-flow)" stroke-width="2.6" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="110" ry="9.2" fill="none" stroke="url(#doppler-flow)" stroke-width="1.6" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="98" ry="7.6" fill="none" stroke="#ffffff" stroke-width="0.95" opacity="0.95"/>
      <ellipse cx="0" cy="0" rx="82" ry="6.0" fill="none" stroke="url(#doppler-flow)" stroke-width="1.2" opacity="0.75"/>

      <!-- Inner Accretion Edge (ISCO) -->
      <ellipse cx="0" cy="0" rx="49" ry="3.8" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="1"/>
      <ellipse cx="0" cy="0" rx="49" ry="3.8" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.4" filter="url(#soft-glow)"/>

      <!-- ── 6. RELATIVISTIC DOPPLER BEAMING FLASH (Left Side Junction) ── -->
      <!-- Approaching matter produces blinding synchrotron radiation -->
      <g filter="url(#vector-bloom)">
        <ellipse cx="-68" cy="0" rx="30" ry="6" fill="#ffffff" opacity="0.95"/>
        <circle cx="-76" cy="0" r="5.5" fill="#ffffff" opacity="0.95"/>
        <ellipse cx="-70" cy="-1.5" rx="42" ry="9" fill="#fef08a" opacity="0.5"/>
      </g>

      <!-- ── 7. MOVING / ORBITING ACCRETION MATTER STREAMS (LIVING DYNAMICS) ── -->
      <!-- Fast Inner Orbiting Stream -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <circle cx="58" cy="0" r="1.6" fill="#ffffff" opacity="0.95"/>
        <circle cx="-58" cy="0" r="1.4" fill="#fef08a" opacity="0.85"/>
      </g>

      <!-- Mid Relativistic Orbiting Stream -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
        <circle cx="95" cy="0" r="1.8" fill="#ffffff" opacity="0.9"/>
        <circle cx="95" cy="0" r="4" fill="#f59e0b" opacity="0.35" filter="url(#soft-glow)"/>
        <circle cx="-110" cy="0" r="1.3" fill="#ffffff" opacity="0.4"/>
        <circle cx="62" cy="0" r="1.1" fill="#fef08a" opacity="0.85"/>
      </g>

      <!-- Outer Slow Orbiting Stream -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="34s" repeatCount="indefinite"/>
        <circle cx="120" cy="0" r="1.5" fill="#f59e0b" opacity="0.75"/>
        <circle cx="-82" cy="0" r="1.9" fill="#ffffff" opacity="0.95"/>
      </g>

      <!-- Astronomical Astrometry Reference Stamp -->
      <g transform="translate(60, 72)" opacity="0.65">
        <text x="0" y="0" class="hud-metric">GARGANTUA // 1.0e8 M☉</text>
        <text x="0" y="9" class="hud-metric">SCHWARZSCHILD METRIC</text>
      </g>
    </g> <!-- End of Gargantua -->

    <!-- ═══════════════ LEFT: CLEAN, SPACIOUS EXECUTIVE SYSTEMS INTERFACE ═══════════════ -->
    <!-- Confined strictly to x=50..x=380: COMPLETELY SEPARATE from the black hole on the right -->

    <!-- Telemetry Status Capsule -->
    <g transform="translate(50, 44)">
      <rect x="0" y="0" width="224" height="22" rx="11" fill="rgba(8, 10, 18, 0.85)" stroke="rgba(88, 166, 255, 0.3)" stroke-width="0.8"/>
      <!-- Pulse Beacon -->
      <circle cx="13" cy="11" r="3.2" fill="#58a6ff"/>
      <circle cx="13" cy="11" r="3.2" fill="none" stroke="#58a6ff" stroke-width="0.8">
        <animate attributeName="r" values="3.2;8.5;3.2" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="14" class="tag">SYS.STATUS // ONLINE</text>
      <line x1="160" y1="6" x2="160" y2="16" stroke="rgba(88, 166, 255, 0.2)" stroke-width="1"/>
      <text x="170" y="14" class="hud-sub">CORE 64b</text>
    </g>

    <!-- Developer Identity: Bold, High-Contrast White -->
    <text x="50" y="124" class="name">Sanidhya Negi</text>

    <!-- Role with Terminal Prompt & Amber Cursor -->
    <text x="52" y="156" class="role">&gt; Systems Engineer<tspan class="cursor" fill="#f59e0b">_</tspan></text>

    <!-- Precision Telemetry Divider Line (Ends cleanly at x=280) -->
    <g>
      <!-- Anchor Node -->
      <circle cx="52" cy="178" r="2" fill="#58a6ff" opacity="0.85"/>
      <!-- Main Line -->
      <line x1="52" y1="178" x2="180" y2="178" stroke="#58a6ff" stroke-width="0.85" opacity="0.45"/>
      <line x1="180" y1="178" x2="280" y2="178" stroke="#f59e0b" stroke-width="0.5" opacity="0.3"/>
      <line x1="280" y1="178" x2="330" y2="178" stroke="#58a6ff" stroke-width="0.3" opacity="0.08" stroke-dasharray="2 4"/>
      <!-- Data Packet Pulse Travelling along Telemetry Line -->
      <circle cy="178" r="1.4" fill="#ffffff">
        <animate attributeName="cx" values="52;320;52" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Core Stack Metadata -->
    <text x="52" y="210" class="meta" xml:space="preserve">C++   <tspan fill="#58a6ff" opacity="0.8">//</tspan>   JAVA   <tspan fill="#58a6ff" opacity="0.8">//</tspan>   SYSTEM DESIGN   <tspan fill="#58a6ff" opacity="0.8">//</tspan>   DSA</text>

    <!-- Telemetry Astrometry Coordinates (Clean, compact, no overlap) -->
    <g transform="translate(52, 240)" opacity="0.75">
      <text class="hud-metric">GARGANTUA // 1.0e8 M☉  •  SCHWARZSCHILD // 12.4°</text>
    </g>
  </g> <!-- End of clipped container -->

  <!-- ═══════════════ CRISP CARD PERIMETER BORDER ═══════════════ -->
  <!-- 1px hairline container border with rounded corners: ZERO overflow -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="12" fill="none" stroke="rgba(88, 166, 255, 0.25)" stroke-width="1"/>
</svg>