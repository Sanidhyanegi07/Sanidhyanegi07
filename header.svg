<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 48px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -2px;
      }
      .role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 14px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .meta {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: 2px;
      }
      .accent-text {
        fill: #58a6ff;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 2px;
      }
      .dot { fill: #58a6ff; }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
    </style>

    <!-- Strict Card Perimeter: NOTHING goes outside rounded boundary -->
    <clipPath id="card-bounds">
      <rect x="0" y="0" width="1000" height="280" rx="12"/>
    </clipPath>

    <!-- Deep Space Obsidian Background (Pure Space, ZERO background glow circle) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020307"/>
      <stop offset="50%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>

    <!-- Glowing Core Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════ STRICTLY CLIPPED CANVAS CONTAINER ═══════════════ -->
  <g clip-path="url(#card-bounds)">
    <!-- Base Deep Space Background -->
    <rect width="100%" height="100%" fill="url(#bg)"/>

    <!-- Astrometric Stars -->
    <g>
      <circle cx="85" cy="80" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="140" cy="220" r="0.6" fill="#58a6ff" opacity="0.6"/>
      <circle cx="260" cy="55" r="0.6" fill="#ffffff" opacity="0.5"/>
      <circle cx="340" cy="180" r="0.5" fill="#58a6ff" opacity="0.5"/>
      <circle cx="440" cy="35" r="0.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="240" r="0.6" fill="#58a6ff" opacity="0.5"/>
      <circle cx="640" cy="230" r="0.75" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="920" cy="45" r="0.8" fill="#ffffff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="955" cy="235" r="0.6" fill="#58a6ff" opacity="0.5"/>
    </g>

    <!-- ═══════════════ LEFT: SLEEK PERSONAL DEVELOPER IDENTITY ═══════════════ -->
    <!-- Confined strictly to x=50..x=380: ZERO overlap, ZERO clutter -->

    <!-- Top-left Status Indicator -->
    <g transform="translate(50, 44)">
      <rect x="0" y="0" width="2" height="12" fill="#58a6ff"/>
      <circle cx="12" cy="6" r="2.5" class="dot" filter="url(#neon-glow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="9.5" class="accent-text">SYS.STATUS // ONLINE</text>
    </g>

    <!-- Name & Role -->
    <text x="50" y="128" class="name">Sanidhya Negi</text>
    
    <text x="52" y="162" class="role">
      &gt; Systems Engineer<tspan class="cursor" fill="#58a6ff">_</tspan>
    </text>

    <!-- Precision Divider Line (Solid, ends cleanly at x=280) -->
    <line x1="50" y1="192" x2="190" y2="192" stroke="#58a6ff" stroke-width="1.2"/>
    <line x1="190" y1="192" x2="310" y2="192" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>

    <!-- Tags -->
    <text x="50" y="226" class="meta" xml:space="preserve">C++   <tspan fill="#58a6ff">//</tspan>   JAVA   <tspan fill="#58a6ff">//</tspan>   SYSTEM DESIGN   <tspan fill="#58a6ff">//</tspan>   DSA</text>

    <!-- ═══════════════ RIGHT: ACTIVE ROTATING 3D DIAMETER AXES CONSTRUCT ═══════════════ -->
    <!-- EVERY diameter is an active moving AXIS LINE with its own particles. NO static circles, NO background haze. -->
    <g transform="translate(770, 140)">

      <!-- ── 7 SPACETIME GEODESIC CURVATURE LINES (Solid, Properly Visible) ── -->
      <!-- Line 1: Inner (Shortest) -->
      <g>
        <path d="M -30,16 Q 0,11 30,16" fill="none" stroke="#385278" stroke-width="1.1"/>
        <circle cx="-30" cy="16" r="1.4" fill="#58a6ff"/>
        <circle cx="30" cy="16" r="1.4" fill="#58a6ff"/>
      </g>

      <!-- Line 2 -->
      <g>
        <path d="M -44,-20 Q 0,-13 44,-20" fill="none" stroke="#2c4263" stroke-width="1.1"/>
        <circle cx="-44" cy="-20" r="1.3" fill="#ffffff"/>
        <circle cx="44" cy="-20" r="1.3" fill="#58a6ff"/>
      </g>

      <!-- Line 3 -->
      <g>
        <path d="M -58,26 Q 0,17 58,26" fill="none" stroke="#354f73" stroke-width="1.1"/>
        <circle cx="-58" cy="26" r="1.4" fill="#58a6ff"/>
        <circle cx="58" cy="26" r="1.4" fill="#ffffff"/>
      </g>

      <!-- Line 4 -->
      <g>
        <path d="M -72,-30 Q 0,-20 72,-30" fill="none" stroke="#2b4060" stroke-width="1.0"/>
        <circle cx="-72" cy="-30" r="1.3" fill="#58a6ff"/>
        <circle cx="72" cy="-30" r="1.3" fill="#ffffff"/>
      </g>

      <!-- Line 5 -->
      <g>
        <path d="M -86,36 Q 0,24 86,36" fill="none" stroke="#30486b" stroke-width="1.0"/>
        <circle cx="-86" cy="36" r="1.4" fill="#ffffff"/>
        <circle cx="86" cy="36" r="1.4" fill="#58a6ff"/>
      </g>

      <!-- Line 6 -->
      <g>
        <path d="M -100,-42 Q 0,-29 100,-42" fill="none" stroke="#253752" stroke-width="0.95"/>
        <circle cx="-100" cy="-42" r="1.3" fill="#58a6ff"/>
        <circle cx="100" cy="-42" r="1.3" fill="#58a6ff"/>
      </g>

      <!-- Line 7: Outermost (Longest) -->
      <g>
        <path d="M -114,48 Q 0,33 114,48" fill="none" stroke="#2f4669" stroke-width="0.95"/>
        <circle cx="-114" cy="48" r="1.4" fill="#58a6ff"/>
        <circle cx="114" cy="48" r="1.4" fill="#ffffff"/>
      </g>

      <!-- ════════ 7 ACTIVE MOVING 3D DIAMETER AXIS LINES (NO STATIC DEAD CIRCLES) ════════ -->

      <!-- ── DIAMETER AXIS 1: LENGTH = 220px (Outer Core Diameter, 36s Clockwise) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
        <!-- Solid Axis Line -->
        <line x1="-110" y1="0" x2="110" y2="0" stroke="#58a6ff" stroke-width="1.4"/>
        <!-- Terminal Particle Nodes at Both Ends -->
        <circle cx="110" cy="0" r="2.6" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="-110" cy="0" r="2.2" fill="#58a6ff"/>
        <!-- Orthogonal Axis Ticks -->
        <line x1="110" y1="-4" x2="110" y2="4" stroke="#58a6ff" stroke-width="1.2"/>
        <line x1="-110" y1="-4" x2="-110" y2="4" stroke="#58a6ff" stroke-width="1.2"/>
      </g>

      <!-- ── DIAMETER AXIS 2: LENGTH = 185px (28s Counter-Clockwise) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
        <!-- Solid Axis Line -->
        <line x1="-92.5" y1="0" x2="92.5" y2="0" stroke="#38bdf8" stroke-width="1.4"/>
        <!-- Terminal Particle Nodes at Both Ends -->
        <circle cx="-92.5" cy="0" r="2.5" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="92.5" cy="0" r="2.0" fill="#38bdf8"/>
        <line x1="-92.5" y1="-3.5" x2="-92.5" y2="3.5" stroke="#38bdf8" stroke-width="1.2"/>
        <line x1="92.5" y1="-3.5" x2="92.5" y2="3.5" stroke="#38bdf8" stroke-width="1.2"/>
      </g>

      <!-- ── DIAMETER AXIS 3: LENGTH = 150px (22s Clockwise) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
        <!-- Solid Axis Line -->
        <line x1="-75" y1="0" x2="75" y2="0" stroke="#79c0ff" stroke-width="1.5"/>
        <!-- Terminal Particle Nodes at Both Ends -->
        <circle cx="75" cy="0" r="2.5" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="-75" cy="0" r="2.0" fill="#79c0ff"/>
        <line x1="75" y1="-3.5" x2="75" y2="3.5" stroke="#79c0ff" stroke-width="1.2"/>
        <line x1="-75" y1="-3.5" x2="-75" y2="3.5" stroke="#79c0ff" stroke-width="1.2"/>
      </g>

      <!-- ── DIAMETER AXIS 4: LENGTH = 120px (16s Counter-Clockwise) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
        <!-- Solid Axis Line -->
        <line x1="-60" y1="0" x2="60" y2="0" stroke="#a5d6ff" stroke-width="1.5"/>
        <!-- Terminal Particle Nodes at Both Ends -->
        <circle cx="-60" cy="0" r="2.4" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="60" cy="0" r="2.0" fill="#58a6ff"/>
        <line x1="-60" y1="-3" x2="-60" y2="3" stroke="#a5d6ff" stroke-width="1.2"/>
        <line x1="60" y1="-3" x2="60" y2="3" stroke="#a5d6ff" stroke-width="1.2"/>
      </g>

      <!-- ── DIAMETER AXIS 5: LENGTH = 90px (11s Clockwise) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
        <!-- Solid Axis Line -->
        <line x1="-45" y1="0" x2="45" y2="0" stroke="#58a6ff" stroke-width="1.6"/>
        <!-- Terminal Particle Nodes at Both Ends -->
        <circle cx="45" cy="0" r="2.4" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="-45" cy="0" r="2.0" fill="#38bdf8"/>
        <line x1="45" y1="-3" x2="45" y2="3" stroke="#58a6ff" stroke-width="1.2"/>
        <line x1="-45" y1="-3" x2="-45" y2="3" stroke="#58a6ff" stroke-width="1.2"/>
      </g>

      <!-- ── DIAMETER AXIS 6: LENGTH = 65px (7s Counter-Clockwise) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
        <!-- Solid Axis Line -->
        <line x1="-32.5" y1="0" x2="32.5" y2="0" stroke="#ffffff" stroke-width="1.6"/>
        <!-- Terminal Particle Nodes at Both Ends -->
        <circle cx="-32.5" cy="0" r="2.2" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="32.5" cy="0" r="1.8" fill="#ffffff"/>
      </g>

      <!-- ── DIAMETER AXIS 7: LENGTH = 40px (Core ISCO Axis, 4s Clockwise) ── -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        <!-- Solid Axis Line -->
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="1.8"/>
        <!-- Rapid Photon Nodes -->
        <circle cx="20" cy="0" r="2.0" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="-20" cy="0" r="1.6" fill="#58a6ff"/>
      </g>

      <!-- ── CENTRAL CORE SINGULARITY ── -->
      <!-- Black Void Center -->
      <circle cx="0" cy="0" r="8" fill="#010204"/>

      <!-- Pulsing Solid Core Beacon -->
      <circle cx="0" cy="0" r="5" fill="#58a6ff" filter="url(#neon-glow)">
        <animate attributeName="r" values="4.5;6;4.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>

    </g> <!-- End of Right Construct -->

  </g> <!-- End of clipped container -->

  <!-- ═══════════════ CRISP CARD PERIMETER BORDER ═══════════════ -->
  <!-- 1px hairline container border with rounded corners: ZERO overflow -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="12" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.35"/>
</svg>