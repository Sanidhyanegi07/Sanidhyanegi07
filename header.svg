<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 52px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -2px;
      }
      .role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 15px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .meta {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 12px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: 2px;
      }
      .accent-text {
        fill: #58a6ff;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 2px;
        font-weight: 700;
      }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
      
      /* Crucial for perfect 3D perspective lines */
      .noscale { vector-effect: non-scaling-stroke; }
    </style>

    <!-- Strict Card Perimeter -->
    <clipPath id="card-bounds">
      <rect x="0" y="0" width="1000" height="280" rx="16"/>
    </clipPath>

    <!-- Deep Space Obsidian Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050a"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Glowing Sun Corona Gradient -->
    <radialGradient id="sun-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#79c0ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <!-- Premium Neon Glow Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════ STRICTLY CLIPPED CANVAS CONTAINER ═══════════════ -->
  <g clip-path="url(#card-bounds)">
    <!-- Base Deep Space Background -->
    <rect width="100%" height="100%" fill="url(#bg)"/>

    <!-- Subtle Astrometric Stars -->
    <g>
      <circle cx="95" cy="70" r="1.0" fill="#ffffff" opacity="0.3"/>
      <circle cx="160" cy="230" r="1.2" fill="#58a6ff" opacity="0.4"/>
      <circle cx="380" cy="190" r="0.8" fill="#58a6ff" opacity="0.5"/>
      <circle cx="480" cy="45" r="1.5" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="250" r="1.0" fill="#58a6ff" opacity="0.4"/>
      <circle cx="680" cy="30" r="1.2" fill="#ffffff">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="940" cy="55" r="1.5" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="920" cy="245" r="1.0" fill="#58a6ff" opacity="0.3"/>
    </g>

    <!-- ═══════════════ LEFT: PRISTINE DEVELOPER IDENTITY ═══════════════ -->
    
    <!-- Top-left Status Indicator -->
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="3" height="14" fill="#58a6ff" rx="1"/>
      <circle cx="14" cy="7" r="3" fill="#58a6ff" filter="url(#neon-glow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="11" class="accent-text">SYS.STATUS // ONLINE</text>
    </g>

    <!-- Name & Role -->
    <text x="60" y="132" class="name">Sanidhya Negi</text>
    
    <text x="62" y="172" class="role">
      &gt; Systems Engineer<tspan class="cursor" fill="#58a6ff">_</tspan>
    </text>

    <!-- Precision Divider Line -->
    <line x1="60" y1="202" x2="220" y2="202" stroke="#58a6ff" stroke-width="1.5"/>
    <line x1="220" y1="202" x2="380" y2="202" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>

    <!-- Tags -->
    <text x="60" y="240" class="meta" xml:space="preserve">C++   <tspan fill="#58a6ff">//</tspan>   JAVA   <tspan fill="#58a6ff">//</tspan>   SYSTEM DESIGN   <tspan fill="#58a6ff">//</tspan>   DSA</text>

    <!-- ═══════════════ RIGHT: MASTERCLASS 3D GYROSCOPE ═══════════════ -->
    <g transform="translate(770, 140)">
      
      <!-- Ambient Deep Space Core Glow -->
      <circle cx="0" cy="0" r="130" fill="url(#sun-core-glow)" opacity="0.1"/>

      <!-- ── RING 1: OUTER (Radius 140) ── -->
      <!-- Tilted 20 degrees, squashed by 0.3 for 3D perspective -->
      <g transform="rotate(20) scale(1, 0.3)">
        <circle cx="0" cy="0" r="140" fill="none" stroke="#2b4060" stroke-width="1.5" class="noscale"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
          <line x1="-140" y1="0" x2="140" y2="0" stroke="#385278" stroke-width="2" class="noscale"/>
          <circle cx="140" cy="0" r="4.5" fill="#58a6ff" filter="url(#neon-glow)" class="noscale"/>
          <circle cx="-140" cy="0" r="3.5" fill="#2b4060" class="noscale"/>
        </g>
      </g>

      <!-- ── RING 2: MID-OUTER (Radius 115) ── -->
      <!-- Tilted 75 degrees, squashed by 0.32 -->
      <g transform="rotate(75) scale(1, 0.32)">
        <circle cx="0" cy="0" r="115" fill="none" stroke="#385278" stroke-width="1.5" class="noscale"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
          <line x1="-115" y1="0" x2="115" y2="0" stroke="#58a6ff" stroke-width="2" class="noscale"/>
          <circle cx="-115" cy="0" r="4" fill="#79c0ff" filter="url(#neon-glow)" class="noscale"/>
          <circle cx="115" cy="0" r="3" fill="#385278" class="noscale"/>
        </g>
      </g>

      <!-- ── RING 3: EQUATORIAL (Radius 90) ── -->
      <!-- Tilted 130 degrees, squashed by 0.35 -->
      <g transform="rotate(130) scale(1, 0.35)">
        <circle cx="0" cy="0" r="90" fill="none" stroke="#58a6ff" stroke-width="1.8" class="noscale"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
          <line x1="-90" y1="0" x2="90" y2="0" stroke="#79c0ff" stroke-width="2" class="noscale"/>
          <circle cx="90" cy="0" r="4" fill="#ffffff" filter="url(#neon-glow)" class="noscale"/>
          <circle cx="-90" cy="0" r="3" fill="#58a6ff" class="noscale"/>
        </g>
      </g>

      <!-- ── RING 4: INNER (Radius 65) ── -->
      <!-- Tilted -40 degrees, squashed by 0.38 -->
      <g transform="rotate(-40) scale(1, 0.38)">
        <circle cx="0" cy="0" r="65" fill="none" stroke="#79c0ff" stroke-width="2" class="noscale"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
          <line x1="-65" y1="0" x2="65" y2="0" stroke="#a5d6ff" stroke-width="2.5" class="noscale"/>
          <circle cx="-65" cy="0" r="3.5" fill="#ffffff" filter="url(#neon-glow)" class="noscale"/>
          <circle cx="65" cy="0" r="2.5" fill="#79c0ff" class="noscale"/>
        </g>
      </g>

      <!-- ── RING 5: CORE (Radius 40) ── -->
      <!-- Tilted -15 degrees, squashed by 0.4 -->
      <g transform="rotate(-15) scale(1, 0.4)">
        <circle cx="0" cy="0" r="40" fill="none" stroke="#a5d6ff" stroke-width="2.5" class="noscale"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
          <line x1="-40" y1="0" x2="40" y2="0" stroke="#ffffff" stroke-width="3" class="noscale"/>
          <circle cx="40" cy="0" r="3" fill="#ffffff" filter="url(#neon-glow)" class="noscale"/>
          <circle cx="-40" cy="0" r="2" fill="#ffffff" class="noscale"/>
        </g>
      </g>

      <!-- ════════ THE CENTRAL GLOWING SUN / STAR ════════ -->
      <!-- Unscaled, preserving perfect spherical bloom and sharp rays -->
      <g>
        <!-- Rotating 8-Point Solar Rays -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
          <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24" fill="#ffffff" opacity="0.9" filter="url(#neon-glow)"/>
          <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16" fill="#79c0ff" opacity="0.8" transform="rotate(45)" filter="url(#neon-glow)"/>
        </g>

        <!-- Pulsing Solar Corona -->
        <circle cx="0" cy="0" r="14" fill="url(#sun-core-glow)">
          <animate attributeName="r" values="12;16;12" dur="2.5s" repeatCount="indefinite"/>
        </circle>

        <!-- Incandescent White-Hot Stellar Core -->
        <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#neon-glow)">
          <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      </g>

    </g> <!-- End of Right Construct -->

  </g> <!-- End of clipped container -->

  <!-- ═══════════════ CRISP CARD PERIMETER BORDER ═══════════════ -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="16" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.2"/>
</svg>