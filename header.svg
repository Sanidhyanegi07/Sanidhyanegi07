<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 700; fill: #ffffff; letter-spacing: -2px; }
      .role { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 15px; font-weight: 400; fill: #00ff66; letter-spacing: 4px; text-transform: uppercase; }
      .meta { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #333; letter-spacing: 1px; }
      .dot { fill: #00ff66; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.5" fill="rgba(255,255,255,0.03)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="12"/>
  <rect width="100%" height="100%" fill="url(#dots)" rx="12"/>

  <!-- Accent line top -->
  <rect x="60" y="50" width="40" height="2" fill="#00ff66" opacity="0.6" rx="1"/>

  <!-- Status indicator -->
  <circle cx="72" cy="72" r="3" class="dot" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="76" class="meta" fill="#00ff66" letter-spacing="2px">AVAILABLE FOR WORK</text>

  <!-- Name -->
  <text x="60" y="135" class="name">Sanidhya Negi</text>

  <!-- Role -->
  <text x="62" y="170" class="role">Systems Engineer</text>

  <!-- Bottom accent -->
  <line x1="60" y1="200" x2="160" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Tags -->
  <text x="60" y="230" class="meta">C++  •  Java  •  React  •  System Design  •  DSA</text>

  <!-- Floating orb system (right side) -->
  <g transform="translate(820, 140)">
    <!-- Outer ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="100" ry="35" stroke="rgba(0,255,102,0.12)" stroke-width="0.5" fill="none" stroke-dasharray="4 8"/>
      <circle cx="100" cy="0" r="2" fill="#00ff66" opacity="0.5"/>
    </g>

    <!-- Mid ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="65" ry="22" stroke="rgba(0,255,102,0.2)" stroke-width="0.8" fill="none" stroke-dasharray="3 6" transform="rotate(30)"/>
      <circle cx="65" cy="0" r="3" fill="#00ff66" opacity="0.6" transform="rotate(30)" filter="url(#glow)"/>
    </g>

    <!-- Inner ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="35" ry="35" stroke="rgba(255,255,255,0.06)" stroke-width="0.5" fill="none" stroke-dasharray="2 6"/>
      <circle cx="35" cy="0" r="1.5" fill="white" opacity="0.4"/>
    </g>

    <!-- Core -->
    <circle cx="0" cy="0" r="6" fill="#00ff66" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2.5" fill="white" opacity="0.9"/>
  </g>

  <!-- Scan line -->
  <rect width="100%" height="1" fill="rgba(0,255,102,0.02)" rx="0.5">
    <animate attributeName="y" values="0;280;0" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
