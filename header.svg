<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 50px;
        font-weight: 800;
        fill: #f0f6fc;
        letter-spacing: -2px;
      }
      .role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 5px;
        text-transform: uppercase;
      }
      .tag {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 9px;
        font-weight: 500;
        fill: #58a6ff;
        letter-spacing: 2.5px;
      }
      .hud-sub {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 8px;
        fill: #7d8590;
        letter-spacing: 1.5px;
      }
      .pill-bg {
        fill: rgba(13, 17, 23, 0.75);
        stroke: rgba(88, 166, 255, 0.25);
        stroke-width: 0.75;
      }
      .skill-txt {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 9px;
        font-weight: 500;
        fill: #c9d1d9;
        letter-spacing: 1.5px;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1.1s step-end infinite; }
    </style>

    <!-- Gaussian Blur Filters for Optical Glow & Galactic Atmosphere -->
    <filter id="core-bloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blur-xs"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="blur-sm"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur-md"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blur-lg"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur-ambient"><feGaussianBlur stdDeviation="35"/></filter>

    <!-- Deep Cosmic Space Vacuum -->
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050c"/>
      <stop offset="50%" stop-color="#050916"/>
      <stop offset="85%" stop-color="#091328"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>

    <!-- Luminous Galactic Core Shader -->
    <radialGradient id="galactic-nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="15%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#1d4ed8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Broad Nebula Cloud Shader -->
    <radialGradient id="galaxy-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#1e40af" stop-opacity="0.07"/>
      <stop offset="75%" stop-color="#0f172a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Spiral Arm Gradient Color Ramp -->
    <linearGradient id="arm-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="arm-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#93c5fd" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════ DEEP SPACE FOUNDATION ═══════════════ -->
  <rect width="100%" height="100%" fill="url(#space-bg)" rx="8"/>

  <!-- Background Galactic Nebula Swells -->
  <ellipse cx="760" cy="140" rx="210" ry="110" fill="url(#galaxy-halo)" filter="url(#blur-ambient)" transform="rotate(-15, 760, 140)"/>
  <ellipse cx="780" cy="135" rx="140" ry="70" fill="#0284c7" opacity="0.04" filter="url(#blur-lg)" transform="rotate(-20, 780, 135)"/>

  <!-- ═══════════════ STARFIELD PARTICLES (COSMIC DUST) ═══════════════ -->
  <g opacity="0.85">
    <!-- Fine Distant Stars -->
    <circle cx="28" cy="45" r="0.3" fill="#fff" opacity="0.3"/>
    <circle cx="55" cy="210" r="0.25" fill="#7dd3fc" opacity="0.4"/>
    <circle cx="92" cy="130" r="0.2" fill="#fff" opacity="0.25"/>
    <circle cx="120" cy="35" r="0.35" fill="#fff" opacity="0.3"/>
    <circle cx="155" cy="245" r="0.25" fill="#38bdf8" opacity="0.35"/>
    <circle cx="185" cy="85" r="0.2" fill="#fff" opacity="0.2"/>
    <circle cx="220" cy="175" r="0.3" fill="#fff" opacity="0.35"/>
    <circle cx="255" cy="55" r="0.25" fill="#7dd3fc" opacity="0.3"/>
    <circle cx="290" cy="230" r="0.35" fill="#fff" opacity="0.25"/>
    <circle cx="325" cy="110" r="0.2" fill="#fff" opacity="0.3"/>
    <circle cx="360" cy="265" r="0.3" fill="#38bdf8" opacity="0.35"/>
    <circle cx="395" cy="40" r="0.25" fill="#fff" opacity="0.4"/>
    <circle cx="430" cy="195" r="0.3" fill="#fff" opacity="0.25"/>
    <circle cx="465" cy="80" r="0.2" fill="#7dd3fc" opacity="0.3"/>
    <circle cx="500" cy="240" r="0.35" fill="#fff" opacity="0.35"/>
    <circle cx="535" cy="145" r="0.25" fill="#fff" opacity="0.25"/>
    <circle cx="570" cy="30" r="0.3" fill="#38bdf8" opacity="0.3"/>
    <circle cx="605" cy="220" r="0.2" fill="#fff" opacity="0.35"/>
    <circle cx="640" cy="75" r="0.35" fill="#fff" opacity="0.25"/>
    <circle cx="675" cy="180" r="0.25" fill="#7dd3fc" opacity="0.3"/>
    <circle cx="710" cy="260" r="0.3" fill="#fff" opacity="0.35"/>
    <circle cx="840" cy="35" r="0.3" fill="#fff" opacity="0.4"/>
    <circle cx="875" cy="255" r="0.35" fill="#38bdf8" opacity="0.3"/>
    <circle cx="915" cy="65" r="0.25" fill="#fff" opacity="0.25"/>
    <circle cx="945" cy="205" r="0.3" fill="#fff" opacity="0.4"/>
    <circle cx="975" cy="120" r="0.25" fill="#7dd3fc" opacity="0.35"/>
  </g>

  <!-- Luminary Twinkling Stars -->
  <circle cx="160" cy="40" r="0.8" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="295" cy="245" r="0.75" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="445" cy="25" r="0.85" fill="#ffffff">
    <animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="260" r="0.8" fill="#7dd3fc">
    <animate attributeName="opacity" values="0.25;0.9;0.25" dur="6.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="890" cy="45" r="0.85" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══════════════ THE MAJESTIC SPIRAL GALAXY ═══════════════ -->
  <!-- Positioned on the right side, viewed at an oblique 3D tilt -->
  <g transform="translate(760, 140)">

    <!-- ── ROTATING GALAXY CORE & MID ARMS (Differential Rotation) ── -->
    <g transform="rotate(-18)">
      <animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="75s" repeatCount="indefinite"/>

      <!-- Outer Diffuse Galactic Disk -->
      <ellipse cx="0" cy="0" rx="175" ry="52" fill="none" stroke="#0284c7" stroke-width="26" opacity="0.03" filter="url(#blur-md)"/>
      <ellipse cx="0" cy="0" rx="160" ry="48" fill="none" stroke="#38bdf8" stroke-width="14" opacity="0.05" filter="url(#blur-sm)"/>

      <!-- ── PRIMARY SPIRAL ARM A (Sweeping Outward) ── -->
      <!-- Arm A Diffuse Underglow -->
      <path d="M 0,0 Q 40,-12 85,-18 Q 130,-22 155,0 Q 170,18 140,36 Q 105,50 40,42" 
            fill="none" stroke="#38bdf8" stroke-width="12" opacity="0.12" filter="url(#blur-sm)"/>
      <!-- Arm A Core Star Stream -->
      <path d="M 0,0 Q 40,-12 85,-18 Q 130,-22 155,0 Q 170,18 140,36 Q 105,50 40,42" 
            fill="none" stroke="url(#arm-grad-1)" stroke-width="3" opacity="0.65" filter="url(#blur-xs)"/>
      <!-- Arm A Crisp Spine -->
      <path d="M 0,0 Q 40,-12 85,-18 Q 130,-22 155,0 Q 170,18 140,36 Q 105,50 40,42" 
            fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.75"/>

      <!-- Arm A Star Clusters & Luminous H II Regions along arm -->
      <circle cx="45" cy="-13" r="1.6" fill="#fff" opacity="0.9"/>
      <circle cx="45" cy="-13" r="4" fill="#38bdf8" opacity="0.3" filter="url(#blur-xs)"/>
      <circle cx="88" cy="-19" r="1.9" fill="#7dd3fc" opacity="0.85"/>
      <circle cx="125" cy="-18" r="1.4" fill="#fff" opacity="0.8"/>
      <circle cx="152" cy="-2" r="2.2" fill="#38bdf8" opacity="0.9"/>
      <circle cx="152" cy="-2" r="5" fill="#38bdf8" opacity="0.3" filter="url(#blur-xs)"/>
      <circle cx="155" cy="18" r="1.5" fill="#fff" opacity="0.75"/>
      <circle cx="128" cy="38" r="1.8" fill="#7dd3fc" opacity="0.8"/>
      <circle cx="85" cy="46" r="1.3" fill="#fff" opacity="0.6"/>

      <!-- ── PRIMARY SPIRAL ARM B (Opposing Counter-Arm) ── -->
      <!-- Arm B Diffuse Underglow -->
      <path d="M 0,0 Q -40,12 -85,18 Q -130,22 -155,0 Q -170,-18 -140,-36 Q -105,-50 -40,-42" 
            fill="none" stroke="#38bdf8" stroke-width="12" opacity="0.12" filter="url(#blur-sm)"/>
      <!-- Arm B Core Star Stream -->
      <path d="M 0,0 Q -40,12 -85,18 Q -130,22 -155,0 Q -170,-18 -140,-36 Q -105,-50 -40,-42" 
            fill="none" stroke="url(#arm-grad-2)" stroke-width="3" opacity="0.65" filter="url(#blur-xs)"/>
      <!-- Arm B Crisp Spine -->
      <path d="M 0,0 Q -40,12 -85,18 Q -130,22 -155,0 Q -170,-18 -140,-36 Q -105,-50 -40,-42" 
            fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.75"/>

      <!-- Arm B Star Clusters -->
      <circle cx="-45" cy="13" r="1.6" fill="#fff" opacity="0.9"/>
      <circle cx="-45" cy="13" r="4" fill="#38bdf8" opacity="0.3" filter="url(#blur-xs)"/>
      <circle cx="-88" cy="19" r="1.9" fill="#7dd3fc" opacity="0.85"/>
      <circle cx="-125" cy="18" r="1.4" fill="#fff" opacity="0.8"/>
      <circle cx="-152" cy="2" r="2.2" fill="#38bdf8" opacity="0.9"/>
      <circle cx="-152" cy="2" r="5" fill="#38bdf8" opacity="0.3" filter="url(#blur-xs)"/>
      <circle cx="-155" cy="-18" r="1.5" fill="#fff" opacity="0.75"/>
      <circle cx="-128" cy="-38" r="1.8" fill="#7dd3fc" opacity="0.8"/>
      <circle cx="-85" cy="-46" r="1.3" fill="#fff" opacity="0.6"/>

      <!-- ── SECONDARY SPURS & TENDRILS (Connecting Feathers) ── -->
      <path d="M 60,-15 Q 90,-4 110,12" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.35"/>
      <path d="M -60,15 Q -90,4 -110,-12" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.35"/>
      <circle cx="108" cy="10" r="1.1" fill="#fff" opacity="0.7"/>
      <circle cx="-108" cy="-10" r="1.1" fill="#fff" opacity="0.7"/>

      <!-- ── DARK DUST LANES (Absorption Nebulae across arms) ── -->
      <!-- The dark silhouette veins that give galaxies realism -->
      <path d="M 12,-4 Q 45,-14 90,-16 Q 135,-16 150,5" fill="none" stroke="#050914" stroke-width="1.8" opacity="0.75"/>
      <path d="M -12,4 Q -45,14 -90,16 Q -135,16 -150,-5" fill="none" stroke="#050914" stroke-width="1.8" opacity="0.75"/>

      <!-- Satellite Cluster Orbiting the Halo -->
      <g>
        <circle cx="135" cy="-42" r="2.5" fill="#ffffff" opacity="0.85" filter="url(#blur-xs)"/>
        <circle cx="135" cy="-42" r="6" fill="#38bdf8" opacity="0.25" filter="url(#blur-sm)"/>
        <circle cx="138" cy="-40" r="1" fill="#7dd3fc" opacity="0.9"/>
        <circle cx="132" cy="-44" r="0.8" fill="#fff" opacity="0.75"/>
      </g>
    </g> <!-- End of rotating galaxy structure -->

    <!-- ── RAPID INNER NUCLEAR DISK (Faster Core Spin) ── -->
    <g transform="rotate(-18)">
      <animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="32s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="65" ry="20" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.25" filter="url(#blur-xs)"/>
      <ellipse cx="0" cy="0" rx="42" ry="13" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.55" filter="url(#blur-xs)"/>
      <circle cx="42" cy="0" r="1.6" fill="#ffffff" opacity="0.95"/>
      <circle cx="-42" cy="0" r="1.6" fill="#38bdf8" opacity="0.9"/>
      <circle cx="0" cy="13" r="1.2" fill="#7dd3fc" opacity="0.8"/>
      <circle cx="0" cy="-13" r="1.2" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- ── GALACTIC NUCLEUS / SUPERMASSIVE CORE (Center Bloom) ── -->
    <!-- Brilliant Inner Core Glow -->
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="url(#galactic-nucleus)" filter="url(#core-bloom)" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="20" ry="7" fill="#ffffff" opacity="0.9" filter="url(#blur-xs)" transform="rotate(-18)"/>

    <!-- Central Supermassive Black Hole Shadow at Galactic Heart -->
    <circle cx="0" cy="0" r="3.2" fill="#03050c"/>
    <circle cx="0" cy="0" r="3.8" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.95">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g> <!-- End of Galaxy -->

  <!-- ═══════════════ LEFT INTERFACE: SLEEK ENGINEERING UI ═══════════════ -->

  <!-- Top Telemetry Status Beacon -->
  <g transform="translate(48, 42)">
    <rect x="0" y="0" width="232" height="22" rx="11" fill="rgba(13, 17, 23, 0.75)" stroke="rgba(88, 166, 255, 0.25)" stroke-width="0.8"/>
    <!-- Sonar Radar Pulse Beacon -->
    <circle cx="13" cy="11" r="3" fill="#58a6ff"/>
    <circle cx="13" cy="11" r="3" fill="none" stroke="#58a6ff" stroke-width="0.8">
      <animate attributeName="r" values="3;9;3" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="13" cy="11" r="5" fill="#58a6ff" opacity="0.25" filter="url(#blur-xs)"/>
    <text x="25" y="14" class="tag">SYS.STATUS // ONLINE</text>
    <line x1="165" y1="6" x2="165" y2="16" stroke="rgba(88, 166, 255, 0.2)" stroke-width="1"/>
    <text x="175" y="14" class="hud-sub">CORE 64b</text>
  </g>

  <!-- Developer Identity: Headline with Soft Ambient Luminance -->
  <text x="48" y="122" class="name" fill="#58a6ff" opacity="0.12" filter="url(#core-bloom)">Sanidhya Negi</text>
  <text x="48" y="122" class="name">Sanidhya Negi</text>

  <!-- Sub-headline: Role with Terminal Cursor -->
  <g transform="translate(49, 154)">
    <text class="role"><tspan fill="#58a6ff" font-weight="700">&gt;</tspan> Systems Engineer<tspan class="cursor" fill="#58a6ff">_</tspan></text>
  </g>

  <!-- Technical Active Telemetry Divider Line -->
  <g>
    <!-- Anchor Node -->
    <circle cx="49" cy="175" r="2" fill="#58a6ff" opacity="0.8"/>
    <circle cx="49" cy="175" r="4.5" fill="#58a6ff" opacity="0.15" filter="url(#blur-xs)"/>
    <!-- Main Line -->
    <line x1="49" y1="175" x2="170" y2="175" stroke="#58a6ff" stroke-width="0.85" opacity="0.4"/>
    <line x1="170" y1="175" x2="310" y2="175" stroke="#388bfd" stroke-width="0.5" opacity="0.15"/>
    <line x1="310" y1="175" x2="420" y2="175" stroke="#58a6ff" stroke-width="0.3" opacity="0.04" stroke-dasharray="2 4"/>
    <!-- Moving Data Packet Pulse along the Line toward Galactic Inflow -->
    <circle cy="175" r="1.4" fill="#ffffff">
      <animate attributeName="cx" values="49;410;49" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Core Competency High-Tech Badges -->
  <g transform="translate(49, 196)">
    <!-- Pill 1: C++ -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="46" height="18" rx="4" class="pill-bg"/>
      <text x="23" y="12" class="skill-txt" text-anchor="middle">C++</text>
    </g>

    <!-- Pill 2: JAVA -->
    <g transform="translate(54, 0)">
      <rect x="0" y="0" width="54" height="18" rx="4" class="pill-bg"/>
      <text x="27" y="12" class="skill-txt" text-anchor="middle">JAVA</text>
    </g>

    <!-- Pill 3: SYSTEM DESIGN -->
    <g transform="translate(116, 0)">
      <rect x="0" y="0" width="118" height="18" rx="4" class="pill-bg"/>
      <text x="59" y="12" class="skill-txt" text-anchor="middle">SYSTEM DESIGN</text>
    </g>

    <!-- Pill 4: DSA -->
    <g transform="translate(242, 0)">
      <rect x="0" y="0" width="46" height="18" rx="4" class="pill-bg"/>
      <text x="23" y="12" class="skill-txt" text-anchor="middle">DSA</text>
    </g>
  </g>

</svg>
