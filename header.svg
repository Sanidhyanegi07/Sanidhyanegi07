<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 52px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -1.5px;
      }
      .role {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 15px;
        font-weight: 500;
        fill: #00f2fe;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .meta {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 12px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: 2px;
      }
      .accent-text {
        fill: #00f2fe;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 2px;
        font-weight: 700;
      }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
      
      /* Guarantees 1px crisp lines even under 3D perspective scaling */
      .noscale { vector-effect: non-scaling-stroke; }
    </style>

    <clipPath id="card-bounds">
      <rect x="0" y="0" width="1000" height="280" rx="16"/>
    </clipPath>

    <!-- Deep Space Obsidian Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010204"/>
      <stop offset="50%" stop-color="#04060b"/>
      <stop offset="100%" stop-color="#010204"/>
    </linearGradient>

    <!-- Cosmic Gas Glow for the Elliptical Galaxy -->
    <radialGradient id="galaxy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="10%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#4facfe" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#007399" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#010204" stop-opacity="0"/>
    </radialGradient>

    <!-- Intense Neon Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════ CANVAS CONTAINER ═══════════════ -->
  <g clip-path="url(#card-bounds)">
    <rect width="100%" height="100%" fill="url(#bg)"/>

    <!-- Deep Space Void -->

    <!-- ═══════════════ LEFT: PREMIUM HUD IDENTITY ═══════════════ -->
    <g transform="translate(50, 45)">
      <!-- Futuristic Vertical Scanline Accent -->
      <rect x="0" y="0" width="2" height="190" fill="#007399" opacity="0.3" rx="1"/>
      <rect x="0" y="0" width="2" height="40" fill="#00f2fe" rx="1">
        <animate attributeName="y" values="0;150;0" dur="6s" repeatCount="indefinite"/>
      </rect>

      <!-- Content Block -->
      <g transform="translate(20, 0)">
        
        <!-- Status Indicator -->
        <g transform="translate(0, 10)">
          <circle cx="4" cy="4" r="4" fill="#00f2fe" filter="url(#neon-glow)">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
          </circle>
          <text x="18" y="8" class="accent-text">SYS.STATUS // ONLINE_</text>
        </g>

        <!-- Identity -->
        <text x="0" y="85" class="name">Sanidhya Negi</text>
        <text x="2" y="125" class="role">
          &gt; Systems Engineer<tspan class="cursor" fill="#00f2fe">_</tspan>
        </text>

        <!-- Precision Divider -->
        <line x1="0" y1="155" x2="160" y2="155" stroke="#00f2fe" stroke-width="1.5"/>
        <line x1="160" y1="155" x2="300" y2="155" stroke="#00f2fe" stroke-width="1" opacity="0.2"/>

        <!-- Tech Stack Tags -->
        <text x="0" y="185" class="meta" xml:space="preserve">C++   <tspan fill="#00f2fe">//</tspan>   JAVA   <tspan fill="#00f2fe">//</tspan>   SYSTEM DESIGN   <tspan fill="#00f2fe">//</tspan>   DSA</text>
      </g>
    </g>


    <!-- ═══════════════ RIGHT: GIANT 3D ELLIPTICAL GALAXY ═══════════════ -->
    <g transform="translate(770, 140)">
      
      <!-- Massive Elliptical Gas Halo -->
      <circle cx="0" cy="0" r="180" fill="url(#galaxy-glow)" opacity="0.4"/>

      <!-- Global Tumble: The entire galaxy slowly rotates on the Z axis -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="180s" repeatCount="indefinite"/>

        <!-- ── PLANE 0° ── -->
        <g transform="rotate(0) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="170" fill="none" stroke="#007399" stroke-width="1.5" opacity="0.5" stroke-dasharray="1 12 2 25 1 8" class="noscale"/>
            <circle cx="0" cy="0" r="135" fill="none" stroke="#4facfe" stroke-width="1.8" opacity="0.7" stroke-dasharray="2 15 3 10 1 5" class="noscale"/>
            <circle cx="135" cy="0" r="3.5" fill="#4facfe" filter="url(#neon-glow)" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="90" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" stroke-dasharray="3 8 2 15 4 6" class="noscale"/>
            <circle cx="0" cy="0" r="45" fill="none" stroke="#ffffff" stroke-width="3" opacity="1.0" stroke-dasharray="4 4 2 5 3 2" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 25° ── -->
        <g transform="rotate(25) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="165" fill="none" stroke="#007399" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 18 1 15 3 10" class="noscale"/>
            <circle cx="0" cy="0" r="140" fill="none" stroke="#4facfe" stroke-width="1.6" opacity="0.6" stroke-dasharray="1 10 2 20 1 5" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="95" fill="none" stroke="#00f2fe" stroke-width="2.2" opacity="0.9" stroke-dasharray="2 12 4 8 2 15" class="noscale"/>
            <circle cx="-95" cy="0" r="4" fill="#00f2fe" filter="url(#neon-glow)" class="noscale"/>
            <circle cx="0" cy="0" r="40" fill="none" stroke="#ffffff" stroke-width="2.8" opacity="0.9" stroke-dasharray="3 5 2 3 4 4" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 50° ── -->
        <g transform="rotate(50) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="36s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="175" fill="none" stroke="#007399" stroke-width="1.8" opacity="0.3" stroke-dasharray="1 25 2 10 1 15" class="noscale"/>
            <circle cx="0" cy="175" r="3" fill="#007399" filter="url(#neon-glow)" class="noscale"/>
            <circle cx="0" cy="0" r="130" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.7" stroke-dasharray="3 12 1 18 2 8" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="85" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.8" stroke-dasharray="4 6 2 10 3 12" class="noscale"/>
            <circle cx="0" cy="0" r="50" fill="none" stroke="#ffffff" stroke-width="3.2" opacity="1.0" stroke-dasharray="5 3 2 6 3 2" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 75° ── -->
        <g transform="rotate(75) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="168" fill="none" stroke="#007399" stroke-width="1.4" opacity="0.4" stroke-dasharray="2 20 1 15 2 10" class="noscale"/>
            <circle cx="0" cy="0" r="138" fill="none" stroke="#4facfe" stroke-width="1.7" opacity="0.6" stroke-dasharray="2 10 2 20 1 12" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="92" fill="none" stroke="#00f2fe" stroke-width="2.4" opacity="0.8" stroke-dasharray="3 10 3 8 2 14" class="noscale"/>
            <circle cx="0" cy="0" r="42" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.9" stroke-dasharray="2 4 4 3 2 5" class="noscale"/>
            <circle cx="42" cy="0" r="3.5" fill="#ffffff" filter="url(#neon-glow)" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 105° ── -->
        <g transform="rotate(105) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="39s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="172" fill="none" stroke="#007399" stroke-width="1.6" opacity="0.5" stroke-dasharray="1 15 3 20 1 10" class="noscale"/>
            <circle cx="0" cy="0" r="132" fill="none" stroke="#4facfe" stroke-width="1.4" opacity="0.7" stroke-dasharray="3 15 1 10 2 8" class="noscale"/>
            <circle cx="0" cy="-132" r="4" fill="#4facfe" filter="url(#neon-glow)" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="88" fill="none" stroke="#00f2fe" stroke-width="2.2" opacity="0.8" stroke-dasharray="2 8 4 12 3 10" class="noscale"/>
            <circle cx="0" cy="0" r="48" fill="none" stroke="#ffffff" stroke-width="3.0" opacity="1.0" stroke-dasharray="4 2 3 5 2 4" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 130° ── -->
        <g transform="rotate(130) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="41s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="165" fill="none" stroke="#007399" stroke-width="1.3" opacity="0.4" stroke-dasharray="2 25 1 10 2 15" class="noscale"/>
            <circle cx="0" cy="0" r="142" fill="none" stroke="#4facfe" stroke-width="1.6" opacity="0.6" stroke-dasharray="1 12 3 18 1 8" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="27s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="94" fill="none" stroke="#00f2fe" stroke-width="2.6" opacity="0.9" stroke-dasharray="3 12 2 10 4 8" class="noscale"/>
            <circle cx="94" cy="0" r="4.5" fill="#00f2fe" filter="url(#neon-glow)" class="noscale"/>
            <circle cx="0" cy="0" r="44" fill="none" stroke="#ffffff" stroke-width="2.8" opacity="0.9" stroke-dasharray="3 4 2 5 4 3" class="noscale"/>
          </g>
        </g>

        <!-- ── PLANE 155° ── -->
        <g transform="rotate(155) scale(1, 0.45)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="37s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="176" fill="none" stroke="#007399" stroke-width="1.7" opacity="0.3" stroke-dasharray="1 30 2 15 1 10" class="noscale"/>
            <circle cx="-176" cy="0" r="3" fill="#007399" filter="url(#neon-glow)" class="noscale"/>
            <circle cx="0" cy="0" r="136" fill="none" stroke="#4facfe" stroke-width="1.5" opacity="0.7" stroke-dasharray="2 10 2 15 3 12" class="noscale"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="23s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="86" fill="none" stroke="#00f2fe" stroke-width="2.1" opacity="0.8" stroke-dasharray="4 8 2 14 2 10" class="noscale"/>
            <circle cx="0" cy="0" r="46" fill="none" stroke="#ffffff" stroke-width="3.4" opacity="1.0" stroke-dasharray="5 4 3 6 2 3" class="noscale"/>
          </g>
        </g>

      </g> <!-- End Global Tumble Group -->

      <!-- ════════ THE CENTRAL SINGULARITY ════════ -->
      <!-- A dark void surrounded by intricate pulsing energy rings -->
      <g>
        <!-- Outer Energy Halo -->
        <circle cx="0" cy="0" r="24" fill="url(#sun-glow)">
          <animate attributeName="r" values="22;26;22" dur="3s" repeatCount="indefinite"/>
        </circle>

        <!-- Intense Starburst Rays (Behind the void) -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
          <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30" fill="#ffffff" opacity="0.6" filter="url(#neon-glow)"/>
          <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20" fill="#00f2fe" opacity="0.8" transform="rotate(45)" filter="url(#neon-glow)"/>
        </g>
        
        <!-- High-Speed Inner Core Tracks -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="12" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 3 2 4" filter="url(#neon-glow)"/>
          <circle cx="0" cy="0" r="8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 3"/>
        </g>

        <!-- The Dark Void (Event Horizon) -->
        <circle cx="0" cy="0" r="5.5" fill="#020306" stroke="#ffffff" stroke-width="1.5" filter="url(#neon-glow)"/>
        <!-- Absolute pitch black center -->
        <circle cx="0" cy="0" r="4" fill="#020306"/>
      </g>

    </g> <!-- End Right Construct -->

  </g> <!-- End Clipped Container -->

  <!-- ═══════════════ GLASS BORDER ═══════════════ -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="16" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.15"/>
</svg>