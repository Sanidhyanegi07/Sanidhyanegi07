name: Update Stats Cache Buster

on:
  schedule:
    # Runs every 6 hours to keep stats fresh
    - cron: '0 */6 * * *'
  push:
    paths:
      - '.github/workflows/update-stats.yml'
  workflow_dispatch:

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh README quote and stats cache
        shell: bash
        run: |
          set -euo pipefail

          timestamp=$(date +%s)
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          old_quotes = (
              "“Simplicity is prerequisite for reliability.” — Edsger W. Dijkstra",
              "“Anxiety is a feeling one gets when one challenges themselves.”",
          )
          new_quote = "“Anxiety is a feeling one gets when one challenges themselves.” — 100 Meters"

          for old_quote in old_quotes:
              if old_quote in content:
                  content = content.replace(old_quote, new_quote, 1)
                  break

          readme.write_text(content, encoding="utf-8")
          PY

          sed -i "s/cache=[0-9]*/cache=${timestamp}/g" README.md

          if git diff --quiet -- README.md; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: polish profile README [skip ci]"
          git push
