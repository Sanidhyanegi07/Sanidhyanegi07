name: Update Stats Cache Buster

on:
  schedule:
    # Runs every 6 hours to keep stats fresh
    - cron: '0 */6 * * *'
  push:
    paths:
      - '.github/workflows/update-stats.yml'
  workflow_dispatch:

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rotate quote and bust stats cache
        shell: bash
        run: |
          set -euo pipefail

          timestamp=$(date +%s)

          python3 - <<'PY'
          import random
          from pathlib import Path

          quotes = [
              '"Anxiety is a feeling one gets when one challenges themselves." — 100 Meters',
              '"Simplicity is prerequisite for reliability." — Edsger W. Dijkstra',
              '"First, solve the problem. Then, write the code." — John Johnson',
              '"Talk is cheap. Show me the code." — Linus Torvalds',
              '"Any fool can write code that a computer can understand. Good programmers write code that humans can understand." — Martin Fowler',
              '"The most disastrous thing that you can ever learn is your first programming language." — Alan Kay',
          ]

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          # Find and replace the current quote
          for q in quotes:
              if q in content:
                  new_quote = random.choice([x for x in quotes if x != q])
                  content = content.replace(q, new_quote, 1)
                  break

          readme.write_text(content, encoding="utf-8")
          PY

          # Bust image caches
          sed -i "s/cache=[0-9]*/cache=${timestamp}/g" README.md

          if git diff --quiet -- README.md; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: rotate quote & refresh stats [skip ci]"
          git push
