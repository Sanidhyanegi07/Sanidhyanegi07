name: Update Stats Cache Buster

on:
  schedule:
    # Runs every 6 hours to keep stats fresh
    - cron: '0 */6 * * *'
  push:
    paths:
      - '.github/workflows/update-stats.yml'
  workflow_dispatch:

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rotate quote and bust stats cache
        shell: bash
        run: |
          set -euo pipefail

          timestamp=$(date +%s)

          python3 - <<'PY'
          import random
          from pathlib import Path

          quotes = [
              '"Running the 100m faster than anyone else can solve almost anything." — Togashi (100 Meters)',
              '"So this is my reality. Well then, if that\'s the case... it\'s time to escape reality!" — Togashi (100 Meters)',
              '"Even someone like me can taste victory once, huh?" — Komiya (100 Meters)',
              '"Until you know your own reality, you can\'t escape from it. Running away with your eyes open and standing still with them closed differ." — Kaidō (100 Meters)',
              '"Looking straight into reality is terrifying, you see." — Kaidō (100 Meters)',
              '"Anxiety is a feeling one gets when one challenges themselves." — 100 Meters',
              '"Talent is something you bloom, instinct is something you polish." — Oikawa Tōru (Haikyū!!)',
              '"The last ones standing are the ones who trained the hardest." — Haikyū!!',
              '"Do you need a reason to not want to lose?" — Hinata Shōyō (Haikyū!!)',
              '"A person grows when they\'re pushed to their limit." — Run with the Wind',
              '"Hard work is worthless for those that don\'t believe in themselves." — Naruto Uzumaki',
              '"A lesson without pain is meaningless. You can\'t gain something without sacrificing something in return." — Edward Elric (FMA)',
              '"If you don\'t like your destiny, don\'t accept it. Instead, have the courage to change it." — Naruto Uzumaki',
              '"When you give up, that\'s when the game is over." — Anzai-sensei (Slam Dunk)',
              '"The only one who can beat me is me." — Aomine Daiki (Kuroko\'s Basketball)',
          ]

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          # Find and replace the current quote
          for q in quotes:
              if q in content:
                  new_quote = random.choice([x for x in quotes if x != q])
                  content = content.replace(q, new_quote, 1)
                  break

          readme.write_text(content, encoding="utf-8")
          PY

          # Bust image caches
          sed -i "s/cache=[0-9]*/cache=${timestamp}/g" README.md

          if git diff --quiet -- README.md; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: rotate quote & refresh stats [skip ci]"
          git push
