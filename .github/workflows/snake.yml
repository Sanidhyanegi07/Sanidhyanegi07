name: Generate Contribution Telemetry

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#79c0ff&color_dots=#10141a,#0d2847,#144b82,#1f6feb,#388bfd
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#79c0ff&color_dots=#10141a,#0d2847,#144b82,#1f6feb,#388bfd

      - name: Decorate snake with dates & HUD telemetry
        run: |
          python .github/scripts/decorate-snake.py dist/github-snake-dark.svg dist/github-snake.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
